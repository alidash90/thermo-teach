<title>MECH230 Lecture 2 Stage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Classroom stage, dark-first: white AU slide on a navy-black ground, notes build on the right one press at a time. */
:root{
  --bg:#0C1522; --panel:#132033; --fg:#F2F1EC; --muted:#9AA7B8; --line:#263650;
  --orange:#F28C3B; --orange-ink:#1A0E05; --gap:#2A1A0E; --navy:#5B9BEA; --box:#17304F; --green:#7FD3A0;
  --display:"Source Serif 4", Georgia, serif; --sans:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F5F3EE; --panel:#FFFFFF; --fg:#1A1F27; --muted:#5E6673; --line:#DDD9D0;
  --orange:#DE6A14; --orange-ink:#FFFFFF; --gap:#FDEADB; --navy:#003C7B; --box:#E8EEF5; --green:#1C6B3A; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#F5F3EE; --panel:#FFFFFF; --fg:#1A1F27; --muted:#5E6673; --line:#DDD9D0;
  --orange:#DE6A14; --orange-ink:#FFFFFF; --gap:#FDEADB; --navy:#003C7B; --box:#E8EEF5; --green:#1C6B3A; color-scheme:light }
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:0 10px}
.bar{display:flex;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1rem;color:var(--muted);white-space:nowrap}
.brand b{color:var(--fg);font-weight:600}
.ctr{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.prog{flex:1 1 120px;height:4px;background:var(--line);border-radius:2px;overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;background:var(--orange);width:0;transition:width .25s}
.tools{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.tb{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:.85rem}
.tb:hover{border-color:var(--orange)} .tb.on{background:var(--orange);color:var(--orange-ink);border-color:var(--orange)}
.tb kbd{font:inherit;font-size:.72rem;color:var(--muted);margin-left:4px}
.tb.on kbd{color:var(--orange-ink)}
:root{--split:50%}
.stage{flex:1;display:grid;grid-template-columns:minmax(0,var(--split)) minmax(0,1fr);gap:22px;min-height:0;padding-top:12px}
.slidewrap{display:flex;flex-direction:column;min-height:0;gap:8px}
.slidewrap img{width:100%;max-width:100%;max-height:calc(100% - 40px);object-fit:contain;object-position:top left;background:#fff;border:1px solid var(--line);border-radius:4px;cursor:zoom-in}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:25;padding:3vh 3vw;cursor:zoom-out}
.zoom.on{display:flex}
.zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:4px}
.eyebrow{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);font-weight:600}
.notes{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.minimap{position:absolute;top:58px;right:16px;width:216px;z-index:12;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:6px 6px 3px;cursor:zoom-in;box-shadow:0 3px 14px rgba(0,0,0,.16);opacity:.93;transition:opacity .15s,transform .15s}
.minimap:hover{opacity:1;transform:scale(1.03)}
.minimap .mcap{font-size:.64rem;font-weight:800;color:var(--orange);text-align:center;letter-spacing:.05em;text-transform:uppercase;margin:1px 0 2px}
.minimap svg{display:block;width:100%;height:auto}
.sysk{margin:8px 0 4px;max-width:560px}
.sysk svg{display:block;width:100%;height:auto}
.sysk .cap{font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--orange);font-weight:600;margin-top:2px;text-align:center}
.notes h1{font-family:var(--display);font-weight:600;font-size:clamp(1.3rem,2.2vw,2rem);line-height:1.15;margin:0 0 10px;text-wrap:balance;color:var(--fg)}
.scroll{overflow-y:auto;min-height:0;padding-right:6px;flex:1}
.line{font-size:clamp(1.05rem,1.55vw,1.5rem);line-height:1.45;margin:0 0 10px;padding-left:1.1em;text-indent:-1.1em;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
.line.show{opacity:1;transform:none}
.line::before{content:"▪";color:var(--navy);margin-right:.45em}
.line.h{font-weight:700;color:var(--navy);padding-left:0;text-indent:0;font-size:clamp(.95rem,1.25vw,1.15rem);letter-spacing:.02em;text-transform:uppercase;margin-top:14px}
.line.h::before{content:none}
.line.eq{background:var(--box);border-radius:8px;padding:10px 14px;text-indent:0;font-family:var(--display);font-size:clamp(1.1rem,1.7vw,1.6rem)}
.line.eq::before{content:none}
.gap{display:inline-block;text-indent:0;min-width:4ch;margin-left:.25em;border-bottom:3px solid var(--orange);background:var(--gap);border-radius:3px 3px 0 0;padding:0 .35em;color:transparent;cursor:pointer;user-select:none;vertical-align:baseline;transition:background .2s}
.gap:hover{background:var(--line)}
.gap.open{color:var(--orange);font-weight:700;background:transparent;animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.notes .foot{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding-top:8px;border-top:1px solid var(--line);margin-top:6px;flex-wrap:wrap}
.big{background:var(--orange);color:var(--orange-ink);border:0;border-radius:8px;padding:10px 18px;font-weight:700;font-size:1rem}
.big.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
.hint{color:var(--muted);font-size:.8rem;margin-right:auto}
/* overlays */
.ov{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:6vh 8vw;z-index:20;text-align:center}
.ov.on{display:flex}
.ov .lbl{color:var(--orange);letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:18px}
.ov .q{font-family:var(--display);font-size:clamp(1.6rem,3.6vw,3rem);line-height:1.25;max-width:26ch;text-wrap:balance}
.ov .a{margin-top:28px;font-size:clamp(1.2rem,2.2vw,1.8rem);line-height:1.4;max-width:40ch;color:var(--green);display:none}
.ov .a.on{display:block;animation:pop .3s}
.ov .row{display:flex;gap:10px;margin-top:36px;flex-wrap:wrap;justify-content:center}
.timer{font-variant-numeric:tabular-nums;font-size:2rem;color:var(--muted);min-width:4ch}
.timer.low{color:var(--orange)}
.black{position:fixed;inset:0;background:#000;display:none;z-index:30}
.black.on{display:block}
.drawer{position:fixed;right:16px;bottom:16px;width:min(440px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:none;z-index:15;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:.9rem;line-height:1.45;max-height:60vh;overflow:auto}
.drawer.on{display:block}
.drawer h3{margin:0 0 6px;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--orange)}
.drawer p{margin:0 0 10px}
.drawer .next{color:var(--muted);font-style:italic}
.jump{display:flex;flex-wrap:wrap;gap:4px}
.jump button{width:30px;height:26px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:4px;font-size:.78rem;font-variant-numeric:tabular-nums}
.jump button.cur{background:var(--navy);color:#fff;border-color:var(--navy)}
button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.line.infig{padding-left:0;text-indent:0;margin:6px 0 14px}
.line.infig::before{content:none}
.fig .cap{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);font-weight:600;margin-bottom:4px}
g.callout{animation:pop .3s ease-out;transform-box:fill-box;transform-origin:center}
.fig .expl{margin:8px 0 2px;padding:8px 12px;border-left:3px solid var(--orange);background:var(--orange-soft);font-size:clamp(.95rem,1.15vw,1.1rem);line-height:1.4}
.fig .expl b{color:var(--orange)}
.fig .expl ul{margin:4px 0 0;padding-left:18px}
.fig .expl li{margin:2px 0}
.fig .cap{display:flex;align-items:center;gap:10px}
.fig .cap .enl{margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:2px 8px;font-size:.75rem;letter-spacing:0;text-transform:none}
@media (max-width:900px){ body{overflow:auto} .app{height:auto} .stage{grid-template-columns:1fr} .slidewrap img{max-height:none} .scroll{overflow:visible} }
@media (prefers-reduced-motion:reduce){ .line,.gap.open,.ov .a.on{animation:none;transition:none} }

.fig{width:min(100%,760px);margin:18px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 8px;text-align:left}
.fig svg{width:100%;height:auto;display:block}
.fig .ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:.9rem;color:var(--muted)}
.fig input[type=range]{flex:1;min-width:140px;accent-color:var(--orange)}
.fig .val{font-variant-numeric:tabular-nums;color:var(--fg);min-width:16ch}
.mode{display:flex;gap:4px}
.mode button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:4px 10px;font-size:.85rem}
.mode button.on{background:var(--orange);color:var(--orange-ink);border-color:var(--orange)}
.ov{overflow:auto}
.ov .a{max-width:60ch}

.solve{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px 14px;margin:6px 0 14px}
.solve .st{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--orange);font-weight:700;margin-bottom:6px}
.step{border-top:1px solid var(--line);padding:10px 0 6px;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
.step.show{opacity:1;transform:none}
.step .sh{display:flex;gap:10px;align-items:center;font-weight:600;font-size:clamp(1rem,1.3vw,1.2rem)}
.step .sh .tag{background:var(--navy);color:#fff;border-radius:4px;padding:2px 8px;font-size:.78rem;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.step .eq{margin:6px 0 2px;overflow-x:auto;font-size:clamp(1rem,1.25vw,1.15rem)}
.step .tbl{font-size:1.05rem;font-weight:600;color:var(--fg);margin:8px 0;padding:8px 12px;background:var(--orange-soft);border-left:4px solid var(--orange);border-radius:0 8px 8px 0}
.step .tbl b{color:var(--orange);text-transform:uppercase;letter-spacing:.06em;font-size:.85rem;display:block;margin-bottom:2px}
.step .note{font-size:.95rem;color:var(--muted);font-style:italic;margin:2px 0}
.step .num{margin:4px 0 2px;overflow-x:auto;display:none;background:var(--box);border-radius:6px;padding:6px 10px;font-size:clamp(1rem,1.25vw,1.15rem)}
.step .num.show{display:block;animation:pop .3s}
.step .res{margin:6px 0 2px;display:none;border:2px solid var(--green);border-radius:6px;padding:6px 10px;font-weight:700;font-size:clamp(1.05rem,1.35vw,1.25rem)}
.step .res.show{display:block;animation:pop .3s}
</style>

<script>
const SOLVES={"E1": {"title": "Example · Cooled, stirred rigid tank (AU slide 7)", "steps": [{"t": "Draw the system: what is inside the dashed line?", "sys": {"dev": "tank", "open": false, "qOut": "Q_out = 500 kJ", "wIn": "W_paddle,in = 100 kJ", "cap": "The water in the sealed rigid tank is the system"}, "note": "Draw the tank, then a dashed boundary around the fluid inside. The tank is sealed: no mass crosses the boundary, so this is a CLOSED system (a fixed mass). Energy still crosses: heat leaves, paddle work enters."}, {"t": "Assumptions, then watch the full balance shrink", "note": "Assumptions: 1) stationary tank, so ΔKE = ΔPE = 0; 2) rigid walls, so no boundary work, the only work is the paddle. AU sign convention: in = +, out = −.", "eq": "\\underbrace{Q_{\\rm in}}_{0}-Q_{\\rm out}+W_{\\rm in}-\\underbrace{W_{\\rm out}}_{0}=\\Delta U+\\underbrace{\\Delta KE}_{0\\ \\rm stationary}+\\underbrace{\\Delta PE}_{0\\ \\rm stationary}", "num": "-Q_{\\rm out}+W_{\\rm in}=U_2-U_1"}, {"t": "Put the numbers in", "eq": "-500+100=U_2-800", "num": "U_2=800-500+100", "res": "U_2=400\\ \\text{kJ}"}, {"t": "Check the direction", "note": "The tank lost more by heat (500) than it gained by stirring (100), so the energy had to drop: 800 → 400. A final value above 800 would have been the sign of a sign error.", "eq": "\\Delta U = -400\\ \\text{kJ} < 0 \\;\\checkmark", "num": "\\text{net } = -500+100 = -400\\ \\text{kJ}"}]}, "E2": {"title": "Example · Heated, stirred pan (AU slide 8)", "steps": [{"t": "Draw the system: the water in the pan", "sys": {"dev": "pan", "open": false, "qIn": "Q_in = 30 kJ", "qOut": "Q_out = 5 kJ", "wIn": "W_paddle,in = 0.5 kJ", "cap": "Closed system: the water; heat in from the range, heat lost to the air"}, "note": "The system is the water in the pan: no mass enters or leaves, so CLOSED. Three energy flows cross the dashed line: 30 kJ heat in from the range, 5 kJ heat out to the air, 0.5 kJ of paddle work in (500 N·m)."}, {"t": "Assumptions, then the full balance shrinks", "note": "Stationary pan: ΔKE = ΔPE = 0, so ΔE = ΔU + nothing. No work leaves.", "eq": "Q_{\\rm in}-Q_{\\rm out}+W_{\\rm in}-\\underbrace{W_{\\rm out}}_{0}=\\Delta E=\\Delta U+\\underbrace{\\Delta KE}_{0}+\\underbrace{\\Delta PE}_{0}", "num": "+30-5+0.5=E_2-10"}, {"t": "Solve", "eq": "E_2=10+30-5+0.5", "num": "E_2=35.5", "res": "E_2=35.5\\ \\text{kJ}"}]}, "E3": {"title": "Example · Steam turbine, Δh (AU slides 9 and 10)", "steps": [{"t": "Draw the system: a turbine with one inlet, one exit", "sys": {"dev": "turbine", "open": true, "inl": "ṁ (h₁ + V₁²/2 + gz₁)", "out": "ṁ (h₂ + V₂²/2 + gz₂)", "wOut": "Ẇ_out = 70 kW", "qOut": "Q̇_out = 11.6 kW", "cap": "Open system (control volume), steady: analyse in rates"}, "note": "Steam flows across the dashed boundary, so this is an OPEN system (a control volume), steady state. In this example nothing is neglected: the fluid carries h, kinetic AND potential energy, and both heat and shaft work leave."}, {"t": "Make the flow rate per second", "note": "Open system, steady. Everything becomes per unit time, so first ṁ.", "eq": "\\dot m=\\frac{500\\ \\text{kg/h}}{3600\\ \\text{s/h}}", "num": "\\dot m=0.139\\ \\text{kg/s}"}, {"t": "Energy balance of a one-inlet, one-exit device (AU slide 5)", "note": "Full balance first: energy in = energy out. Only Q̇_in and Ẇ_in are zero here; everything else stays. Rearranged to the AU form: out-flows negative.", "eq": "\\underbrace{\\dot Q_{\\rm in}}_{0}+\\underbrace{\\dot W_{\\rm in}}_{0}+\\dot m\\!\\left(h_1+\\tfrac{V_1^2}{2}+gz_1\\right)=\\dot Q_{\\rm out}+\\dot W_{\\rm out}+\\dot m\\!\\left(h_2+\\tfrac{V_2^2}{2}+gz_2\\right)", "num": "-\\dot Q_{\\rm out}-\\dot W_{\\rm out}=\\dot m\\left[\\Delta h+\\frac{V_2^2-V_1^2}{2}+g(z_2-z_1)\\right]"}, {"t": "Kinetic and potential terms, in kJ/kg", "note": "Watch the units. h is in kJ/kg, but V²/2 lands in m²/s² = J/kg (joules, not kilojoules), so divide by 1000 (1 kJ = 1000 J) before adding it to h. gz is the same story: 9.81 × metres = J/kg. Exit is 5 m below the inlet: z₂ − z₁ = −5 m.", "eq": "\\frac{V_2^2-V_1^2}{2}=\\frac{360^2-60^2}{2(1000)},\\qquad g\\,\\Delta z=\\frac{9.81(-5)}{1000}", "num": "=63.0\\ \\text{kJ/kg},\\qquad =-0.049\\ \\text{kJ/kg}"}, {"t": "Solve for Δh", "eq": "-11.6-70=0.139\\,[\\Delta h+63.0-0.049]", "num": "\\Delta h=\\frac{-81.6}{0.139}-63.0+0.049=-587.1-63.0+0.05", "res": "\\Delta h\\approx-650\\ \\text{kJ/kg}"}, {"t": "Read the sizes", "note": "Enthalpy drop 587, kinetic 63, potential 0.05. The elevation term never mattered; the velocity term did, because 360 m/s is fast. This is the habit: compute all three once, then learn which ones to drop.", "eq": "|\\Delta h|\\gg\\Delta ke\\gg\\Delta pe", "num": "587\\ \\text{vs}\\ 63\\ \\text{vs}\\ 0.05\\ \\text{kJ/kg}"}]}, "E4": {"title": "Example · Electric motor efficiency (AU slide 14)", "steps": [{"t": "Efficiency is useful out over paid in", "eq": "\\eta=\\frac{\\text{useful energy output}}{\\text{energy input}}=\\frac{\\dot W_{\\rm mech,out}}{\\dot W_{\\rm elect,in}}", "num": "\\eta=\\frac{90\\ \\text{W}}{100\\ \\text{W}}=0.90", "res": "\\eta_{\\rm motor}=90\\,\\%"}, {"t": "Where did the 10 W go?", "note": "Not destroyed: it leaves as heat from the windings and friction. The first law still balances; efficiency only says how much came out in the form we wanted.", "eq": "\\dot Q_{\\rm loss}=100-90=10\\ \\text{W}"}]}, "E5": {"title": "Example · Power plant overall efficiency (AU slide 16)", "steps": [{"t": "Efficiencies of devices in series multiply", "note": "Each sub-system hands its output to the next, so the fractions stack.", "eq": "\\eta_{\\rm overall}=\\eta_{\\rm boiler}\\,\\eta_{\\rm turbine}\\,\\eta_{\\rm generator}", "num": "\\eta_{\\rm overall}=(0.88)(0.40)(0.98)", "res": "\\eta_{\\rm overall}=0.345\\approx35\\,\\%"}, {"t": "Read the result", "note": "35 % is below the weakest link (40 %): a chain of devices is always worse than its worst member. Two thirds of the fuel's energy never becomes electricity, most of it lost in the turbine's heat rejection.", "eq": "\\eta_{\\rm overall}<\\min(\\eta_i)"}]}, "P1": {"title": "Problem 1 · Saturated liquid in a rigid tank (Ex 3-1)", "steps": [{"t": "Where am I on the map?", "note": "'Saturated liquid' = left edge of the dome. One number (T) fixes everything: open the temperature table.", "eq": "\\text{state} = \\text{saturated liquid at } T=90\\,^{\\circ}\\text{C}", "tbl": "Table A-4, row 90 °C, f columns"}, {"t": "Pressure comes from the table, not from a choice", "eq": "P=P_{\\rm sat@90\\,^{\\circ}C}", "num": "P=70.183\\ \\text{kPa}", "res": "P=70.183\\ \\text{kPa}"}, {"t": "Volume = mass × specific volume of the liquid", "eq": "V=m\\,v_{f@90\\,^{\\circ}C}", "tbl": "Table A-4, 90 °C: v_f = 0.001036 m³/kg  (v_g = 2.3593 would give 118 m³, a room of steam — wrong column!)", "num": "V=(50)(0.001036)", "res": "V=0.0518\\ \\text{m}^3\\approx52\\ \\text{L}"}]}, "P2": {"title": "Problem 2 · Saturated mixture: P and V (Ex 3-2)", "steps": [{"t": "Inside the dome: temperature alone fixes the pressure", "eq": "P=P_{\\rm sat@90\\,^{\\circ}C}", "tbl": "Table A-4, row 90 °C", "num": "P=70.183\\ \\text{kPa}", "res": "P=70.183\\ \\text{kPa}"}, {"t": "Quality from the masses", "eq": "x=\\frac{m_g}{m_t}=\\frac{2}{10}", "num": "x=0.2"}, {"t": "Lever rule for v, then V", "note": "v_f and v_g from the same A-4 row as Step 1.", "eq": "v=v_f+x\\,(v_g-v_f),\\qquad V=m_t\\,v", "tbl": "Table A-4, 90 °C: v_f = 0.001036, v_g = 2.3593 m³/kg", "num": "v=0.001036+(0.2)(2.3582)=0.4727\\ \\text{m}^3/\\text{kg},\\qquad V=(10)(0.4727)", "res": "V=4.73\\ \\text{m}^3"}, {"t": "Check it the long way", "note": "Two kg of vapour fill 99.8 % of the tank. That is why x is a mass fraction, never a volume fraction.", "eq": "V=m_f v_f+m_g v_g=(8)(0.001036)+(2)(2.3593)", "num": "V=0.008+4.72=4.73\\ \\text{m}^3\\;\\checkmark"}]}, "P3": {"title": "Problem 3 · R-134a: 80 L, 4 kg at 160 kPa (Ex 3-3)", "steps": [{"t": "Specific volume from what is given", "eq": "v=\\frac{V}{m}=\\frac{0.080}{4}", "num": "v=0.02\\ \\text{m}^3/\\text{kg}"}, {"t": "Region test: compare v with v_f and v_g", "note": "This is the step students skip. Never open a table before you know the region.", "eq": "v_f<v<v_g\\;\\Rightarrow\\;\\text{saturated mixture}", "tbl": "Table A-12, row 160 kPa: T_sat = −15.60 °C, v_f = 0.0007435, v_g = 0.12355 m³/kg", "num": "0.0007<0.02<0.1236\\;\\checkmark", "res": "T=T_{\\rm sat@160\\,kPa}=-15.6\\,^{\\circ}\\text{C}"}, {"t": "Quality from v (inverse lever rule)", "eq": "x=\\frac{v-v_f}{v_g-v_f}", "num": "x=\\frac{0.02-0.0007435}{0.12355-0.0007435}=\\frac{0.01926}{0.12281}", "res": "x=0.157"}, {"t": "Enthalpy by the lever rule", "note": "x = 0.157 from Step 3.", "eq": "h=h_f+x\\,h_{fg}", "tbl": "Table A-12, 160 kPa: h_f = 31.18, h_fg = 209.96 kJ/kg", "num": "h=31.18+(0.157)(209.96)", "res": "h=64.1\\ \\text{kJ/kg}"}, {"t": "Volume of the vapour phase", "note": "15.7 % of the mass fills 77.6 of the 80 litres; the liquid is the thin 2.4 L at the bottom.", "eq": "m_g=x\\,m,\\qquad V_g=m_g\\,v_g", "num": "m_g=(0.157)(4)=0.628\\ \\text{kg},\\qquad V_g=(0.628)(0.12355)", "res": "V_g=0.0776\\ \\text{m}^3=77.6\\ \\text{L}"}]}, "P4": {"title": "Problem 4 · Compressed liquid: exact vs shortcut (Ex 3-4)", "steps": [{"t": "Region test", "eq": "P=5\\ \\text{MPa}\\gg P_{\\rm sat@80\\,^{\\circ}C}\\;\\Rightarrow\\;\\text{compressed liquid}", "tbl": "Table A-4, 80 °C: P_sat = 47.416 kPa", "num": "5000\\ \\text{kPa}\\gg47.4\\ \\text{kPa}"}, {"t": "Exact value from the compressed-liquid table", "eq": "u=u_{@\\,5\\,\\rm MPa,\\;80\\,^{\\circ}C}", "tbl": "Table A-7, 5 MPa block, 80 °C row", "num": "u=333.82\\ \\text{kJ/kg}", "res": "u=333.82\\ \\text{kJ/kg (exact)}"}, {"t": "Shortcut: saturated liquid at the same temperature", "note": "Temperature, never pressure: liquids barely feel pressure.", "eq": "u\\approx u_{f@80\\,^{\\circ}C}", "tbl": "Table A-4, 80 °C: u_f = 334.97 kJ/kg", "num": "u\\approx334.97\\ \\text{kJ/kg}"}, {"t": "Error of the shortcut", "eq": "\\text{error}=\\frac{334.97-333.82}{333.82}\\times100", "num": "=0.34\\,\\%", "res": "\\text{error}=0.34\\,\\%<1\\,\\%"}]}, "P5": {"title": "Problem 5 · Superheated vapour: find T (Ex 3-5)", "steps": [{"t": "Region test: compare h with h_g", "eq": "h=2890>h_{g@0.5\\,\\rm MPa}\\;\\Rightarrow\\;\\text{superheated, open A-6}", "tbl": "Table A-5, 0.5 MPa: h_g = 2748.1 kJ/kg", "num": "2890>2748.1\\;\\checkmark"}, {"t": "Interpolate in A-6 at 0.5 MPa: set up the interpolation table", "note": "Write the two table rows that bracket the unknown, with the unknown in the middle row.", "eq": "\\begin{array}{c|c} T\\ (^{\\circ}\\mathrm{C}) & h\\ (\\mathrm{kJ/kg}) \\\\ \\hline 200 & 2855.8 \\\\ T=? & 2890 \\\\ 250 & 2961.0 \\end{array}", "tbl": "Table A-6, 0.5 MPa block: 200 °C → 2855.8; 250 °C → 2961.0 kJ/kg. Sanity: T must beat T_sat(0.5 MPa) = 151.83 °C."}, {"t": "Interpolate in A-6 at 0.5 MPa: the cross equation (equal fractions)", "note": "Same fraction of the way down both columns: distance from the top row over the full gap.", "eq": "\\frac{T-200}{250-200}=\\frac{2890-2855.8}{2961.0-2855.8}", "num": "\\frac{T-200}{250-200}=\\frac{T-200}{50}=\\frac{34.2}{105.2}=0.325"}, {"t": "Interpolate in A-6 at 0.5 MPa: solve", "eq": "T-200=50\\times0.325=16.3\\;\\Rightarrow\\;T=200+16.3", "res": "T=216.3\\,^{\\circ}\\text{C}"}]}, "P6": {"title": "Problem 6 · Fill the table (a) to (e) (Ex 3-6)", "steps": [{"t": "Row (a): P = 200 kPa, x = 0.6", "note": "A quality exists, so it is a mixture; P alone fixes T.", "eq": "T=T_{\\rm sat@200\\,kPa},\\qquad u=u_f+x\\,u_{fg}", "tbl": "Table A-5, 200 kPa: T_sat = 120.21 °C, u_f = 504.50, u_fg = 2024.6 kJ/kg", "num": "T=120.21\\,^{\\circ}\\text{C},\\qquad u=504.50+(0.6)(2024.6)", "res": "u=1719.3\\ \\text{kJ/kg}\\quad\\text{(saturated mixture)}", "map": {"title": "Row (a) on the T-v map", "cap": "Row (a)", "pts": [{"v": 0.5319, "T": 120.21, "k": "a", "lab": "200 kPa, x = 0.6: inside the dome at T_sat = 120.21 °C, plotted 60 % of the way from the liquid edge to the vapour edge, exactly where its quality puts it. u = 1719.3 kJ/kg.", "col": "or", "dx": 10, "dy": -10, "x": 0.6}]}}, {"t": "Row (b): T = 125 °C, u = 1600 kJ/kg", "note": "Region test first: u sits between u_f and u_g, so mixture.", "eq": "u_f<1600<u_g\\;\\Rightarrow\\;\\text{mixture};\\qquad x=\\frac{u-u_f}{u_{fg}}", "tbl": "Table A-4, 125 °C: P_sat = 232.23 kPa, u_f = 524.83, u_g = 2534.3 (u_fg = 2009.5)", "num": "P=232.23\\ \\text{kPa},\\qquad x=\\frac{1600-524.83}{2009.5}", "res": "x=0.535\\quad\\text{(saturated mixture)}", "map": {"title": "Row (b) on the T-v map", "cap": "Row (b)", "pts": [{"v": 0.4125, "T": 125, "k": "b", "lab": "125 °C, u = 1600 kJ/kg: u_f < u < u_g, so inside the dome. x = 0.535, so the point sits just past the middle of the 125 °C line, like the book sketch. P = P_sat = 232.23 kPa.", "col": "or", "dx": 10, "dy": -10, "x": 0.535}]}}, {"t": "Row (c): P = 1 MPa, u = 2950: region test, then the table", "note": "u = 2950 > u_g = 2582.8 (Table A-5, 1 MPa): superheated, x undefined. Bracket u inside the 1 MPa block of A-6, unknown in the middle row.", "eq": "\\begin{array}{c|c} T\\ (^{\\circ}\\mathrm{C}) & u\\ (\\mathrm{kJ/kg}) \\\\ \\hline 350 & 2875.7 \\\\ T=? & 2950 \\\\ 400 & 2957.9 \\end{array}", "tbl": "Table A-6, 1 MPa block: 350 °C → 2875.7; 400 °C → 2957.9 kJ/kg", "map": {"title": "Row (c) on the T-v map", "cap": "Row (c)", "pts": [{"v": 0.3043, "T": 395.2, "k": "c", "lab": "1 MPa, u = 2950 > u_g = 2582.8: right of the dome, superheated vapour. T = 395.2 °C by interpolation; x undefined.", "col": "gr", "dx": 10, "dy": -10}]}}, {"t": "Row (c): the cross equation (equal fractions)", "note": "Same fraction of the way down both columns: distance from the top row over the full gap.", "eq": "\\frac{T-350}{400-350}=\\frac{2950-2875.7}{2957.9-2875.7}", "num": "\\frac{T-350}{400-350}=\\frac{T-350}{50}=\\frac{74.3}{82.2}=0.904"}, {"t": "Row (c): solve", "eq": "T-350=50\\times0.904=45.2\\;\\Rightarrow\\;T=350+45.2", "res": "T=395.2\\,^{\\circ}\\text{C}\\quad(x\\ \\text{undefined})"}, {"t": "Row (d): T = 75 °C, P = 500 kPa", "note": "Two properties are given, T and P, so run the region test before touching any u column: open A-5 at P = 500 kPa and read T_sat = 151.83 °C. Our water is at 75 °C, far below the boiling temperature at this pressure, so it cannot be boiling: compressed liquid. (A-4 gives the same verdict the other way: P_sat at 75 °C is 38.60 kPa, and our 500 kPa is far above it.) The 500 kPa then barely matters: u follows the temperature.", "eq": "T<T_{\\rm sat@500\\,kPa}\\;\\Rightarrow\\;\\text{compressed liquid};\\qquad u\\approx u_{f@75\\,^{\\circ}C}", "tbl": "Table A-5, 500 kPa: T_sat = 151.83 °C.  Table A-4, 75 °C: u_f = 313.99", "num": "75<151.83\\;\\checkmark", "res": "u\\approx314.0\\ \\text{kJ/kg}\\quad(x\\ \\text{undefined})", "map": {"title": "Row (d) on the T-v map", "cap": "Row (d)", "pts": [{"v": 0.001026, "T": 75, "k": "d", "lab": "75 °C, 500 kPa: region test in A-5 at 500 kPa → T_sat = 151.83 °C; 75 °C is below it, so the water cannot boil: compressed liquid, LEFT of the dome. (A-4 agrees: P_sat(75 °C) = 38.60 kPa, far below our 500 kPa.) In reality v ≈ v_f(75 °C) = 0.001026 and the point hugs the liquid line; we draw it clearly left, like the book sketch. u ≈ u_f(75 °C) = 314.0 kJ/kg.", "col": "nv", "dx": 10, "dy": 5, "off": -34}]}}, {"t": "Row (e): P = 850 kPa, x = 0", "note": "x = 0 says saturated liquid, the left edge: read the f columns.", "eq": "T=T_{\\rm sat@850\\,kPa},\\qquad u=u_{f@850\\,kPa}", "tbl": "Table A-5, 850 kPa: T_sat = 172.94 °C, u_f = 731.00", "num": "T=172.94\\,^{\\circ}\\text{C}", "res": "u=731.00\\ \\text{kJ/kg}\\quad\\text{(saturated liquid)}", "map": {"title": "Row (e) on the T-v map", "cap": "Row (e)", "pts": [{"v": 0.001118, "T": 172.94, "k": "e", "lab": "850 kPa, x = 0: exactly ON the saturated-liquid line. T = T_sat = 172.94 °C, u = u_f = 731.00 kJ/kg.", "col": "nv", "dx": 10, "dy": -9, "x": 0.0}]}}]}, "P7": {"title": "Problem 7 · Adiabatic steam turbine (slides 47-48)", "steps": [{"t": "Draw the system: insulated turbine, one inlet, one exit", "sys": {"dev": "turbine", "open": true, "inl": "ṁ (h₁ + V₁²/2 + gz₁)", "out": "ṁ (h₂ + V₂²/2 + gz₂)", "wOut": "Ẇ_out", "cap": "Open system (control volume), steady flow; insulated casing, so no Q̇ arrow at all"}, "note": "Steam crosses the dashed boundary: OPEN system (control volume), steady. The casing is insulated, so no heat arrow crosses the line anywhere."}, {"t": "Assumptions, then the full balance shrinks", "note": "Assumptions: 1) steady flow; 2) adiabatic, q = 0 (insulated); 3) only shaft work. We deliberately KEEP the kinetic and potential terms this once, to see their real size.", "eq": "\\begin{gathered}\\dot E_{\\rm in}=\\dot E_{\\rm out}\\\\ \\underbrace{\\dot Q_{\\rm in}}_{0\\ \\rm adiabatic}+\\underbrace{\\dot W_{\\rm in}}_{0}+\\dot m\\!\\left(h_1+\\tfrac{V_1^2}{2}+gz_1\\right)=\\underbrace{\\dot Q_{\\rm out}}_{0\\ \\rm adiabatic}+\\dot W_{\\rm out}+\\dot m\\!\\left(h_2+\\tfrac{V_2^2}{2}+gz_2\\right)\\end{gathered}", "num": "w_{\\rm out}=(h_1-h_2)+\\frac{V_1^2-V_2^2}{2}+g\\,(z_1-z_2)"}, {"t": "State 1: region test, then A-6", "note": "400 °C beats T_sat at 2 MPa (212.38 °C): superheated.", "eq": "T_1=400\\,^{\\circ}\\text{C}>T_{\\rm sat@2\\,MPa}\\;\\Rightarrow\\;\\text{superheated}", "tbl": "Table A-5, 2 MPa: T_sat = 212.38 °C.  Table A-6, 2 MPa, 400 °C: h₁ = 3248.4 kJ/kg", "num": "h_1=3248.4\\ \\text{kJ/kg}"}, {"t": "State 2: mixture at 15 kPa with x₂ = 0.9", "eq": "h_2=h_f+x_2\\,h_{fg}", "tbl": "Table A-5, 15 kPa: h_f = 225.94, h_fg = 2372.3 kJ/kg", "num": "h_2=225.94+(0.9)(2372.3)", "res": "h_2=2361.0\\ \\text{kJ/kg}"}, {"t": "The three terms, all in kJ/kg", "note": "Watch the units. h from the tables is already kJ/kg, but V²/2 comes out in m²/s², and one m²/s² is exactly one J/kg: joules, not kilojoules. Since 1 kJ = 1000 J, divide by 1000 to turn J/kg into kJ/kg before adding it to h. Same for gz: 9.81 × metres also gives J/kg. h₁, h₂ from Steps 3 and 4.", "eq": "h_1-h_2;\\qquad \\frac{V_1^2-V_2^2}{2(1000)};\\qquad \\frac{g(z_1-z_2)}{1000}", "num": "887.4;\\qquad \\frac{50^2-180^2}{2000}=-14.95;\\qquad \\frac{9.81(4)}{1000}=0.04", "res": "w_{\\rm out}=887.4-14.95+0.04=872.5\\ \\text{kJ/kg}"}, {"t": "Mass flow from the power", "eq": "\\dot m=\\frac{\\dot W_{\\rm out}}{w_{\\rm out}}", "num": "\\dot m=\\frac{5000\\ \\text{kJ/s}}{872.5\\ \\text{kJ/kg}}", "res": "\\dot m=5.73\\ \\text{kg/s}"}]}, "P8": {"title": "Problem 8 · Throttling of R-134a (slide 49)", "steps": [{"t": "Draw the system: a valve in a pipe", "sys": {"dev": "throttle", "open": true, "inl": "ṁ h₁ (0.8 MPa)", "out": "ṁ h₂ (0.12 MPa)", "cap": "Open system, steady; the dashed line hugs a tiny valve"}, "note": "Refrigerant flows through: OPEN system, steady. The boundary hugs a tiny valve: no shaft sticks out and there is no surface area to exchange heat."}, {"t": "Assumptions kill every term except h", "note": "Assumptions: 1) no work, w = 0 (no shaft); 2) adiabatic, q ≈ 0 (tiny device); 3) same pipe size in and out, ΔKE ≈ 0; 4) horizontal, ΔPE = 0.", "eq": "\\underbrace{q}_{0}+\\underbrace{w}_{0}+h_1+\\underbrace{\\tfrac{V_1^2}{2}}_{\\approx\\ \\rm exit}+\\underbrace{gz_1}_{=\\ \\rm exit}=h_2+\\tfrac{V_2^2}{2}+gz_2", "num": "h_2=h_1\\quad\\text{(the throttling rule)}"}, {"t": "State 1: saturated liquid at 0.8 MPa", "eq": "T_1=T_{\\rm sat@0.8\\,MPa},\\qquad h_1=h_{f@0.8\\,MPa}", "tbl": "Table A-12, 0.8 MPa: T_sat = 31.31 °C, h_f = 95.48 kJ/kg", "num": "T_1=31.31\\,^{\\circ}\\text{C},\\qquad h_1=95.48\\ \\text{kJ/kg}=h_2"}, {"t": "Region test at 0.12 MPa", "note": "h₂ = 95.48 from Step 2 sits between h_f and h_g: mixture, so T₂ = T_sat.", "eq": "h_f<h_2<h_g\\;\\Rightarrow\\;\\text{mixture},\\;T_2=T_{\\rm sat@0.12\\,MPa}", "tbl": "Table A-12, 0.12 MPa: T_sat = −22.32 °C, h_f = 22.47, h_g = 236.99 kJ/kg", "num": "22.5<95.5<237\\;\\checkmark", "res": "T_2=-22.32\\,^{\\circ}\\text{C}"}, {"t": "Quality and the temperature drop", "eq": "x_2=\\frac{h_2-h_f}{h_g-h_f},\\qquad \\Delta T=T_2-T_1", "num": "x_2=\\frac{95.48-22.47}{236.99-22.47}=\\frac{73.01}{214.52}=0.340,\\qquad \\Delta T=-22.32-31.31", "res": "x_2=0.340,\\qquad \\Delta T=-53.6\\,^{\\circ}\\text{C}"}]}, "P9": {"title": "Problem 9 · Steam turbine: ideal work, actual power (slides 50-51)", "steps": [{"t": "Draw the system: adiabatic turbine (the ideal one first)", "sys": {"dev": "turbine", "open": true, "inl": "ṁ h₁", "out": "ṁ h₂", "wOut": "Ẇ_out", "cap": "Open system, steady; inlet and exit speeds and heights not given, so ΔKE, ΔPE dropped"}, "note": "Mass crosses the boundary: OPEN system, steady. No speeds or heights are given, so ΔKE and ΔPE are taken negligible, and the ideal turbine is adiabatic."}, {"t": "Assumptions, then the full balance shrinks", "note": "Assumptions: steady; adiabatic (q = 0); ΔKE ≈ 0, ΔPE ≈ 0; shaft work only.", "eq": "\\underbrace{\\dot Q}_{0\\ \\rm adiabatic}+\\underbrace{\\dot W_{\\rm in}}_{0}+\\dot m\\big(h_1+\\underbrace{\\tfrac{V_1^2}{2}}_{\\approx0}+\\underbrace{gz_1}_{\\approx0}\\big)=\\dot W_{\\rm out}+\\dot m\\big(h_2+\\underbrace{\\tfrac{V_2^2}{2}}_{\\approx0}+\\underbrace{gz_2}_{\\approx0}\\big)", "num": "w_{\\rm out}=h_1-h_2"}, {"t": "State 1: superheated at 2 MPa, 250 °C", "eq": "T_1=250>T_{\\rm sat@2\\,MPa}=212.38\\,^{\\circ}\\text{C}\\;\\Rightarrow\\;\\text{superheated}", "tbl": "Table A-6, 2 MPa, 250 °C: h₁ = 2903.3 kJ/kg", "num": "h_1=2903.3\\ \\text{kJ/kg}"}, {"t": "State 2: mixture at 0.1 MPa, x₂ = 0.85", "eq": "h_2=h_f+x_2\\,(h_g-h_f)", "tbl": "Table A-5, 0.1 MPa: h_f = 417.51, h_g = 2675.0 kJ/kg", "num": "h_2=417.51+(0.85)(2257.5)", "res": "h_2=2336.4\\ \\text{kJ/kg}"}, {"t": "Ideal work per kg", "note": "h values from Steps 2 and 3.", "eq": "w_{\\rm out}=h_1-h_2=2903.3-2336.4", "res": "w_{\\rm out}=566.9\\ \\text{kJ/kg}"}, {"t": "Actual power", "note": "Flow rate first: 600 kg/min ÷ 60 = 10 kg/s; then the 80 % applies to the power.", "eq": "\\dot W_{\\rm actual}=\\eta\\,\\dot m\\,w_{\\rm out}", "num": "\\dot W_{\\rm actual}=(0.80)(10)(566.9)=4535\\ \\text{kW}", "res": "\\dot W_{\\rm actual}\\approx4.5\\ \\text{MW}"}]}, "P10": {"title": "Problem 10 · Steam nozzle with heat loss (slides 52-53)", "steps": [{"t": "Draw the system: a nozzle that loses heat", "sys": {"dev": "nozzle", "open": true, "inl": "ṁ (h₁ + V₁²/2)", "out": "ṁ (h₂ + V₂²/2)", "qOut": "Q̇_out = 25 kW", "cap": "Open system, steady; a nozzle exists to change KE, so KE stays in the balance"}, "note": "Steam flows through: OPEN system, steady. A nozzle has no shaft, so w = 0; it is horizontal, so ΔPE = 0. We must NOT drop ΔKE: changing the speed is the whole point of the device. Heat leaks out, so q_out stays too."}, {"t": "Assumptions, then the full balance shrinks", "note": "Assumptions: steady; no work (no shaft); ΔPE = 0. Keep h, KE and the heat loss.", "eq": "\\underbrace{\\dot W}_{0\\ \\rm no\\ shaft}+\\dot m\\big(h_1+\\tfrac{V_1^2}{2}+\\underbrace{gz_1}_{0}\\big)=\\dot Q_{\\rm out}+\\dot m\\big(h_2+\\tfrac{V_2^2}{2}+\\underbrace{gz_2}_{0}\\big)", "num": "\\frac{V_2^2}{2}=\\frac{V_1^2}{2}+(h_1-h_2)-q_{\\rm out}"}, {"t": "Mass flow from the inlet area", "eq": "\\dot m=\\frac{A_1V_1}{v_1}", "num": "\\dot m=\\frac{(0.08)(10)}{0.38429}", "res": "\\dot m=2.082\\ \\text{kg/s}"}, {"t": "Heat loss per kg", "note": "ṁ from Step 2.", "eq": "q_{\\rm out}=\\frac{\\dot Q_{\\rm out}}{\\dot m}=\\frac{25}{2.082}", "num": "q_{\\rm out}=12.0\\ \\text{kJ/kg}"}, {"t": "Energy balance, solve for V₂", "note": "Same unit bridge, run backwards: the enthalpy terms are in kJ/kg, and we need V₂ in m/s, so multiply by 1000 to go from kJ/kg to J/kg = m²/s² before taking the square root. Inlet KE (50 m²/s² term) is nothing beside 183 600: the enthalpy drop became speed.", "eq": "\\frac{V_2^2}{2}=(h_1-h_2-q_{\\rm out})(1000)+\\frac{V_1^2}{2}", "num": "\\frac{V_2^2}{2}=(3267.7-3072.1-12.0)(1000)+50=183\\,650", "res": "V_2=\\sqrt{2(183\\,650)}=606\\ \\text{m/s}"}, {"t": "Exit volume flow", "note": "ṁ from Step 2, v₂ from Step 1.", "eq": "\\dot{\\mathcal V}_2=\\dot m\\,v_2=(2.082)(1.31623)", "res": "\\dot{\\mathcal V}_2=2.74\\ \\text{m}^3/\\text{s}"}]}, "P11": {"title": "Problem 11 · Mixing chamber (slides 54-55)", "steps": [{"t": "Draw the system: two streams in, one out", "sys": {"dev": "mixing", "open": true, "inl": "ṁ₁ h₁ (cold)", "in2": "ṁ₂ h₂ (steam)", "out": "ṁ₃ h₃ (warm)", "qOut": "Q̇_out = 20 kW", "cap": "Open system, steady, TWO inlets: mass and energy both need balancing"}, "note": "Two streams cross the boundary in, one out: OPEN system, steady. With two inlets, write TWO balances: mass and energy. No shaft, so w = 0; speeds and heights negligible."}, {"t": "Two balances for two inlets, one exit", "eq": "\\dot m_1+\\dot m_2=\\dot m_3;\\qquad \\underbrace{\\dot W}_{0}+\\dot m_1h_1+\\dot m_2h_2+\\underbrace{\\Delta KE,\\Delta PE}_{\\approx0}=\\dot m_3h_3+\\dot Q_{\\rm out}", "note": "Assumptions: steady; no work; ΔKE ≈ ΔPE ≈ 0. The chamber leaks 1200 kJ/min = 20 kW of heat.", "num": "\\dot m_1h_1+\\dot m_2h_2=\\dot m_3h_3+\\dot Q_{\\rm out}"}, {"t": "Region test per stream against T_sat at 200 kPa", "note": "20 °C and 60 °C below 120.21 °C: compressed liquid, h ≈ h_f at T. 150 °C above: superheated.", "eq": "T_{\\rm sat@200\\,kPa}=120.21\\,^{\\circ}\\text{C}", "tbl": "Table A-4: h₁ ≈ h_f@20 °C = 83.91; h₃ ≈ h_f@60 °C = 251.18.  Table A-6, 200 kPa, 150 °C: h₂ = 2769.1 kJ/kg", "num": "h_1=83.91,\\quad h_2=2769.1,\\quad h_3=251.18\\ \\text{kJ/kg}"}, {"t": "Substitute ṁ₃ = 2.5 + ṁ₂ and solve", "note": "Heat loss 1200 kJ/min = 20 kW. h values from Step 2.", "eq": "(2.5)(83.91)+\\dot m_2(2769.1)=(2.5+\\dot m_2)(251.18)+20", "num": "209.8+2769.1\\,\\dot m_2=627.95+251.18\\,\\dot m_2+20;\\qquad 2517.9\\,\\dot m_2=438.2", "res": "\\dot m_2=0.174\\ \\text{kg/s}"}, {"t": "The AU slide prints 0.166", "note": "The slide drops the 20 kW loss. Keep the loss and slightly more steam is needed: 0.174. Say in class which one you quote.", "eq": "\\dot Q_{\\rm out}=0\\;\\Rightarrow\\;\\dot m_2=0.166\\ \\text{kg/s}"}]}, "P12": {"title": "Test yourself 1 · Throttling wet steam (slide 56)", "steps": [{"t": "Draw the system: a throttle again", "sys": {"dev": "throttle", "open": true, "inl": "ṁ h₁ (0.5 MPa, x = 0.95)", "out": "ṁ h₂ (10 kPa)", "cap": "Open system, steady: same shrink as Problem 8, so h₂ = h₁"}, "note": "Open system, steady. Same assumptions as Problem 8: no work, no heat, ΔKE ≈ 0, ΔPE = 0, so the full balance collapses to h₂ = h₁."}, {"t": "h₁ by the lever rule, and it rides through the throttle", "eq": "h_1=h_f+x_1\\,h_{fg}=h_2", "tbl": "Table A-5, 1.0 MPa: h_f = 762.51, h_fg = 2014.6 kJ/kg", "num": "h_1=762.51+(0.95)(2014.6)", "res": "h_2=2676.4\\ \\text{kJ/kg}"}, {"t": "Region test at 10 kPa", "note": "h₂ beats h_g: we have left the dome. No quality exists.", "eq": "h_2=2676.4>h_{g@10\\,kPa}\\;\\Rightarrow\\;\\text{superheated}", "tbl": "Table A-5, 10 kPa: h_f = 191.81, h_g = 2583.9 kJ/kg", "num": "2676.4>2583.9\\;\\checkmark", "res": "x_2\\ \\text{undefined: superheated vapour}"}, {"t": "Exit temperature: set up the interpolation table", "note": "Write the two table rows that bracket the unknown, with the unknown in the middle row. The trap first: computing x₂ gives 1.04, and a quality above 1 is the alarm that we are outside the dome.", "eq": "\\begin{array}{c|c} T\\ (^{\\circ}\\mathrm{C}) & h\\ (\\mathrm{kJ/kg}) \\\\ \\hline 50 & 2592.0 \\\\ T_2=? & 2676.4 \\\\ 100 & 2687.5 \\end{array}", "tbl": "Table A-6, 10 kPa block: 50 °C → 2592.0; 100 °C → 2687.5 kJ/kg"}, {"t": "Exit temperature: the cross equation (equal fractions)", "note": "Same fraction of the way down both columns: distance from the top row over the full gap.", "eq": "\\frac{T_2-50}{100-50}=\\frac{2676.4-2592.0}{2687.5-2592.0}", "num": "\\frac{T_2-50}{100-50}=\\frac{T_2-50}{50}=\\frac{84.4}{95.5}=0.884"}, {"t": "Exit temperature: solve", "eq": "T_2-50=50\\times0.884=44.2\\;\\Rightarrow\\;T_2=50+44.2", "res": "T_2\\approx94\\,^{\\circ}\\text{C}"}]}, "P13": {"title": "Test yourself 2 · Heating a mixture in a rigid tank (slide 56)", "steps": [{"t": "Draw the system: a sealed rigid tank being heated", "sys": {"dev": "tank", "open": false, "qIn": "Q_in", "cap": "Closed system: fixed mass AND fixed volume, so v = V/m never changes"}, "note": "Sealed tank: no mass crosses the boundary, CLOSED system. Rigid: V fixed. Fixed m and fixed V mean v = V/m is frozen for the whole process: that single sentence solves all three parts."}, {"t": "The key sentence", "note": "Rigid and closed: m and V fixed, so v never changes. On a P-v or T-v diagram the process is a vertical line going up.", "eq": "v_2=v_1=v_3"}, {"t": "(a) T₂ at 151.95 kPa: set up the interpolation table", "note": "Both states are mixtures, so each T is T_sat at its pressure. T₁ reads directly at 101.325 kPa; T₂ needs the bracket, unknown in the middle row.", "eq": "\\begin{array}{c|c} P\\ (\\mathrm{kPa}) & T_{\\rm sat}\\ (^{\\circ}\\mathrm{C}) \\\\ \\hline 150 & 111.35 \\\\ 151.95 & T_2=? \\\\ 175 & 116.04 \\end{array}", "tbl": "Table A-5: 101.325 kPa → T_sat = 99.97 °C (state 1, read directly); 150 kPa → 111.35 °C; 175 kPa → 116.04 °C"}, {"t": "(a) T₂ at 151.95 kPa: the cross equation (equal fractions)", "note": "Same fraction of the way down both columns: distance from the top row over the full gap.", "eq": "\\frac{T_2-111.35}{116.04-111.35}=\\frac{151.95-150}{175-150}", "num": "\\frac{T_2-111.35}{116.04-111.35}=\\frac{T_2-111.35}{4.69}=\\frac{1.95}{25}=0.078"}, {"t": "(a) T₂ at 151.95 kPa: solve", "eq": "T_2=111.35+4.69\\times0.078=111.35+0.37", "res": "T_1\\approx100\\,^{\\circ}\\text{C},\\qquad T_2=111.7\\,^{\\circ}\\text{C}"}, {"t": "(b) State 1 fixes v and the total mass", "eq": "v_1=v_f+x_1(v_g-v_f),\\qquad m=\\frac{V}{v_1},\\qquad m_{g1}=x_1m", "tbl": "Table A-5, 101.325 kPa: v_f = 0.001043, v_g = 1.6734 m³/kg", "num": "v_1=0.001043+(0.5)(1.6724)=0.8372;\\qquad m=\\frac{0.5}{0.8372}=0.597\\ \\text{kg};\\qquad m_{g1}=0.299", "res": "m_{g1}=0.30\\ \\text{kg}"}, {"t": "State 2: same v, new edges", "note": "v₂ = v₁ = 0.8372 from Step 3; v_f, v_g interpolated at 151.95 kPa.", "eq": "x_2=\\frac{v_2-v_f}{v_g-v_f},\\qquad m_{g2}=x_2\\,m", "tbl": "A-5 interpolated at 151.95 kPa: v_f ≈ 0.001053, v_g ≈ 1.1473 m³/kg", "num": "x_2=\\frac{0.8372-0.001053}{1.1463}=0.729;\\qquad m_{g2}=(0.729)(0.597)", "res": "m_{g2}=0.44\\ \\text{kg}"}, {"t": "(c) P₃ where v_g equals our v: set up the interpolation table", "note": "Write the two table rows that bracket the unknown, with the unknown in the middle row. v_g falls as P rises, so both differences on the right are negative; their ratio is still positive.", "eq": "\\begin{array}{c|c} P\\ (\\mathrm{kPa}) & v_g\\ (\\mathrm{m}^3/\\mathrm{kg}) \\\\ \\hline 200 & 0.88578 \\\\ P_3=? & 0.8372 \\\\ 225 & 0.79329 \\end{array}", "tbl": "Table A-5: 200 kPa → v_g = 0.88578; 225 kPa → v_g = 0.79329 m³/kg"}, {"t": "(c) P₃ where v_g equals our v: the cross equation (equal fractions)", "note": "Same fraction of the way down both columns: distance from the top row over the full gap.", "eq": "\\frac{P_3-200}{225-200}=\\frac{0.8372-0.88578}{0.79329-0.88578}", "num": "\\frac{P_3-200}{225-200}=\\frac{P_3-200}{25}=\\frac{-0.04858}{-0.09249}=0.525"}, {"t": "(c) P₃ where v_g equals our v: solve", "eq": "P_3=200+25\\times0.525=200+13.1", "res": "P_3\\approx213\\ \\text{kPa}"}]}};
const DATA=[{"n": 1, "title": "Lecture 2: Energy, energy transfer, and general energy analysis", "img": "img/p-01.jpg", "lines": ["# Where we are", "Lecture 1 gave us the vocabulary: system and surroundings, properties, state, process. We also met the three ways energy moves: heat, work, and mass flow. What we never did is make them [[balance]].", "# Today, in three blocks", "Block 1 (slides 2 to 10): the first law. Energy in minus energy out equals the [[change]] inside. One equation, closed and open systems, three worked examples.", "Block 2 (slides 11 to 16): efficiency. How much of what you pay for comes out as what you [[wanted]]. Devices in series multiply.", "Block 3 (slides 17 to 56): pure substances. Water refuses to follow one simple formula, so we learn to read its [[tables]], then we solve real devices with them: turbines, throttles, nozzles, mixing chambers.", "# Bottom line", "One law, one skill: balance the energy, and know [[where on the map]] the substance is before you open a table."], "ask": [{"q": "What are the three ways energy can cross a system boundary?", "a": "Heat, work, and mass flow (mass carries energy with it)."}, {"q": "What does the first law forbid?", "a": "Creating or destroying energy; it can only change form or move."}, {"q": "Why do we need property tables for water?", "a": "No simple equation covers liquid, mixture and vapour; the measured values live in tables."}], "teach": "Ask the class: when your phone charges, where does the wall energy end up? Collect three answers, then promise the balance sheet.", "book": "Çengel 9e Ch. 2 and 3 overview [10e Ch. 2, 3]"}, {"n": 2, "title": "Everything starts with the first law", "img": "img/p-02.jpg", "lines": ["# The first law of thermodynamics", "Energy cannot be [[created]] or [[destroyed]]. It can be [[transferred]] between the system and the surroundings, or [[converted]] from one form to another.", "# What that implies for any system", "If more energy [[enters]] than [[leaves]], the system must gain energy; if more leaves than enters, it must lose energy.", "= ( Total energy entering ) − ( Total energy leaving ) = ( [[Change]] in the total energy of the system )", "= [[E_in]] − [[E_out]] = [[ΔE_system]]          ΔE_system = E_final − E_initial = [[E₂ − E₁]]", "# Inside ΔE: the energy stored in the system", "For the systems we study, the total energy stored in the system is  E = U + KE + PE:   [[Internal]] energy U (molecular motion and bonds),  [[Kinetic]] energy KE = [[½ m V²]],  [[Potential]] energy PE = [[m g z]].", "= ΔE_system = [[ΔU]] + [[ΔKE]] + [[ΔPE]]", "# The distinction that runs the whole chapter", "U, KE and PE describe energy the system [[has]]. Heat and work, which come next, describe energy [[crossing the boundary]]."], "ask": [{"q": "A room gains 300 kJ by heat and loses 200 kJ by work out. What is ΔE?", "a": "ΔE = +300 − 200 = +100 kJ. In minus out, always."}, {"q": "Is 'energy balance' a new law or bookkeeping?", "a": "Bookkeeping of the first law: what is not stored went out."}, {"q": "What does a negative ΔE mean physically?", "a": "The system ended with less stored energy: more left than entered."}], "teach": "Open with the bank-account picture: deposits, withdrawals, balance. Energy obeys the same arithmetic.", "book": "Çengel 9e §2-6, Eq. 2-32 [10e §2-6]"}, {"n": 3, "title": "Energy in and out: Q, W and the sign convention", "img": "img/p-03.jpg", "lines": ["# Last slide: what the system has. This slide: how energy crosses the boundary", "ΔE_system = ΔU + ΔKE + ΔPE is stored energy. For a closed system (no mass crossing) energy has only two ways across the boundary: [[heat, Q]] and [[work, W]].", "Heat Q: energy transferred because of a [[temperature difference]].     Work W: energy transferred by any other mechanism: [[shaft]] work, moving-boundary work, electrical work.", "A system does not contain heat or work. It contains [[energy]]; heat and work describe how energy is [[transferred]].", "# Sign convention (this course): direction decides the sign", "Heat in ⇒ Q [[+]]      Heat out ⇒ Q [[−]]      Work done ON the system (in) ⇒ W [[+]]      Work done BY the system (out) ⇒ W [[−]]", "= [[±Q]] [[±W]] = ΔU + ΔKE + ΔPE       (say the direction in words, then write the sign)", "# Check it on the right-hand box of this slide", "Heat in 15 kJ, heat out 3 kJ, shaft work in 6 kJ  ⇒  ΔE = (+15) + (−3) + (+6) = [[18 kJ]]   (not 15 + 3 + 6 = 24: direction, not magnitude)", "# No change in bulk speed or elevation", "V₁ = V₂ ⇒ ΔKE = [[0]]      z₁ = z₂ ⇒ ΔPE = [[0]]      ⇒  ±Q ± W = [[ΔU]]   → the equation on the next slide"], "ask": [{"q": "A car accelerates on a flat road. Which of ΔU, ΔKE, ΔPE moves?", "a": "ΔKE (and a little ΔU in the engine); ΔPE = 0 on a flat road."}, {"q": "For a sealed rigid tank sitting still, what does ΔE reduce to?", "a": "ΔU: nothing moves and nothing climbs, so KE and PE drop out."}, {"q": "Which term is usually the giant in heating problems?", "a": "ΔU; kinetic and potential changes are tiny next to internal energy."}], "teach": "Point at the three terms and ask which die for a tank bolted to the floor.", "book": "Çengel 9e §2-6, Eq. 2-33 [10e §2-6]"}, {"n": 4, "title": "Closed system: assemble the equation", "img": "img/p-04.jpg", "lines": ["# We are not learning a new law; we are assembling the last two slides", "= 1.  E_in − E_out = ΔE_system", "= 2.  Closed ⇒ no mass crosses ⇒ transfers are heat and work:  (Q_in − Q_out) + (W_in − W_out) = [[±Q ± W]]", "= 3.  ΔE_system = m(u₂ − u₁) + ½ m (V₂² − V₁²) + m g (z₂ − z₁)", "= 4.  ±Q ± W = m(u₂ − u₁) + ½ m (V₂² − V₁²) + m g (z₂ − z₁)       [kJ]", "Sign reminder (slide 3 owns it): in ⇒ [[+]], out ⇒ [[−]], for both Q and W.", "# No change in bulk speed or elevation", "V₁ = V₂ ⇒ ΔKE = [[0]]      z₁ = z₂ ⇒ ΔPE = [[0]]      ⇒  ±Q ± W = [[ΔU]] = m(u₂ − u₁)", "# Warning: rigid does NOT mean all work is zero", "Rigid ⇒ the wall does not move ⇒ moving-boundary work [[W_b = 0]]. Shaft or electrical work can still cross the boundary.", "# Quick check", "Rigid sealed tank of air heated on a stove, no shaft:  Q [[+ (in)]],  W_b = 0 and no other work ⇒ W = [[0]],  ΔKE = ΔPE = 0  ⇒  Q = [[ΔU]]", "@fig:energyBars|The balance as bars: watch the account settle"], "ask": [{"q": "In ±Q ± W = ΔE, what sign does heat loss carry?", "a": "Minus: out is negative in the AU convention."}, {"q": "A stationary closed system: why does ΔE become ΔU?", "a": "No motion, no elevation change: KE and PE cannot change."}, {"q": "The book writes Q − W = ΔE with W positive out. Same law?", "a": "Yes: only the sign bookkeeping differs. Pick one convention and never mix."}], "teach": "Write ±Q ± W = ΔU and drill the convention: in is plus, out is minus. Warn once that the textbook takes W out as positive.", "book": "Çengel 9e §2-6, energy balance for closed systems [10e §2-6]"}, {"n": 5, "title": "Open system, one inlet, one outlet", "img": "img/p-05.jpg", "lines": ["# 1. What is new", "Closed system: no mass crosses. Open system: [[mass]] crosses the control surface, and it [[carries energy]] with it.", "# 2. Steady state = no accumulation inside with time (not 'nothing is happening')", "= dm_CV/dt = [[0]]      dE_CV/dt = [[0]]      one inlet, one outlet ⇒ ṁ₁ = ṁ₂ = [[ṁ]]", "# 3. Per unit time", "A continuous-flow device is analysed per second:  Q → [[Q̇]] [kW],  W → [[Ẇ]] [kW],  m → [[ṁ]] [kg/s].  (h, V, z, T, P do not get dots.)", "# 4. Why h appears", "A flowing kg possesses u + V²/2 + g z, and pushing it through the control surface costs flow work [[P v]].  Bundle:  h = u + [[P v]]  (enthalpy).", "= Energy carried per kg of flowing fluid = [[h]] + V²/2 + g z", "# 5. The equation (AU slide 5)", "= ±Q̇ ± Ẇ = ṁ ( [[h₂ − h₁]] ) + ½ ṁ ( V₂² − V₁² ) + ṁ g ( z₂ − z₁ )", "# 6. Read the last two terms correctly", "½ṁ(V₂² − V₁²) and ṁg(z₂ − z₁) are changes in the rate of KE and PE [[carried by the flowing fluid]] between inlet and outlet, not energy stored inside the device.", "Units: [kg/s] × [kJ/kg] = [[kW]].   V²/2 and g z come out in J/kg ⇒ divide by [[1000]] before adding to h in kJ/kg.", "@fig:cvDevice|One box, many devices: same balance, different term that matters"], "ask": [{"q": "Why does h = u + Pv appear for flowing fluid but not in a tank?", "a": "Flow pushes its way in and out: the Pv flow work rides with every kg. In a tank nothing flows."}, {"q": "What does 'steady' buy us?", "a": "No accumulation: everything per unit time, in = out."}, {"q": "Why divide V²/2 by 1000?", "a": "To convert m²/s² into kJ/kg (1 kJ/kg = 1000 m²/s²)."}], "teach": "Start from the question: what changes when the fluid moves through instead of sitting inside?", "book": "Çengel 9e §5-2, 5-3 steady-flow energy balance [10e §5-3]"}, {"n": 6, "title": "Many inlets, many outlets: two balances, not one", "img": "img/p-06.jpg", "lines": ["# Why this slide exists", "Real devices can have several streams: a mixing chamber has [[two in, one out]]; an extraction turbine has [[one in, two out]]. So we account for every stream.", "# First balance: mass (steady ⇒ no accumulation)", "= Σ ṁ_in = [[Σ ṁ_out]]   [kg/s]", "# What each stream carries, per kg", "= h + V²/2 + g z        with  h = u + [[P v]]", "# Second balance: energy (steady ⇒ dE_CV/dt = 0 ⇒ in = out)", "= Q̇_in + Ẇ_in + Σ_in ṁ ( h + V²/2 + g z )  =  [[Q̇_out]] + [[Ẇ_out]] + Σ_out ṁ ( h + V²/2 + g z )", "Do not mix sign methods: in this form every quantity is a [[positive magnitude]] on the IN side or the OUT side. Never also write Q_out as a negative number.", "If the device were not steady, the storage term [[dE_CV/dt]] would stay on the right.", "# Collapse check", "One inlet, one outlet ⇒ the sums have one term each ⇒ AU slide 5.   No mass at all ⇒ AU slide 4.   One law.", "# The recipe from here on", "Draw the control volume → every mass, heat and work arrow → [[mass]] balance → [[energy]] balance → cross out terms only when the [[physics]] justifies it."], "ask": [{"q": "What is conserved at a junction of three pipes?", "a": "Mass: Σṁ in = Σṁ out. And energy, each stream carrying its own h + V²/2 + gz."}, {"q": "When do the sums collapse to the single-stream equation?", "a": "One inlet, one exit: each sum has one term."}, {"q": "A mixing chamber has 2 in, 1 out. How many balance equations do we get?", "a": "Two: one mass, one energy; enough for two unknowns."}], "teach": "Draw a tee junction and ask where the mass goes; the multi-stream sums write themselves.", "book": "Çengel 9e §5-1, 5-2 mass and energy balances [10e §5-2]"}, {"n": 7, "title": "Example: the cooled, stirred tank", "img": "img/p-07.jpg", "lines": ["# Read it like an engineer", "A rigid tank, sealed: a [[closed]] system. Inside, a hot fluid with U₁ = [[800]] kJ. Two things happen at once: it loses [[500]] kJ of heat, and a paddle wheel does [[100]] kJ of work on it.", "Missing: the final internal energy U₂.", "# Strategy", "Rigid and stationary kills ΔKE, ΔPE and boundary work in one stroke, so the whole first law is three numbers and one sign decision per number. Sanity check before solving: more leaves than enters, so U₂ must come out [[below]] 800.", "@solve:E1", "# Bottom line", "First law in one breath: what came in, minus what went out, is what [[stayed]]."], "ask": [{"q": "Why is there no boundary work here?", "a": "The tank is rigid: the walls do not move, so no P dV work."}, {"q": "Flip it: the paddle extracts 100 kJ instead. New U₂?", "a": "U₂ = 800 − 500 − 100 = 200 kJ."}, {"q": "Which sign convention are we using and what is the textbook's?", "a": "AU: in = +, out = −. The book writes Q − W with W positive out; same physics."}], "teach": "Have them guess U₂ before solving: bigger or smaller than 800? Why?", "book": "Çengel 9e §2-6, in the style of Ex. 2-10 [10e §2-6]"}, {"n": 8, "title": "Example: the heated, stirred pan", "img": "img/p-08.jpg", "lines": ["# Read it like an engineer", "Same game, more flows. A closed pan of water: [[30]] kJ of heat in from the range, [[5]] kJ lost to the air, and 500 N·m of paddle work in. Initial energy E₁ = [[10]] kJ.", "The only trap is the unit: 500 N·m = [[0.5]] kJ, not 500 kJ.", "# Strategy", "List every arrow with its sign before touching the calculator: +30, −5, +0.5. One line of first law finishes it.", "@solve:E2", "# Bottom line", "Write the [[signs]] first, calculate second: that order prevents almost every first-law mistake."], "ask": [{"q": "Why is the 500 N·m worth only half a kJ?", "a": "1 N·m = 1 J; 500 J = 0.5 kJ. Units before arithmetic."}, {"q": "Net heat for this pan?", "a": "+30 − 5 = +25 kJ into the system."}, {"q": "If the pan were uncovered and steam escaped, could we still use this closed-system balance?", "a": "No: mass would cross the boundary; it becomes an open system."}], "teach": "Ask who noticed the N·m trap before revealing it; reward the catch.", "book": "Çengel 9e §2-6, in the style of Ex. 2-11 [10e §2-6]"}, {"n": 9, "title": "Example: the steam turbine (read it like an engineer)", "img": "img/p-09.jpg", "lines": ["# Read it like an engineer", "Our first open system. Steam flows through a turbine at [[500]] kg/h. In: 60 m/s. Out: [[360]] m/s, and the exit sits [[5]] m below the inlet. The shaft delivers [[70]] kW and the casing loses 11.6 kW of heat.", "Missing: the change in specific enthalpy Δh = h₂ − h₁. Notice: no temperatures, no tables; just the balance.", "# Strategy", "Steady flow, one in, one out: the slide-5 equation. Order of attack: ṁ first (everything becomes per second), then each fluid term in kJ/kg, then solve for Δh. Sanity checks: a turbine extracts energy, so Δh must come out strongly [[negative]]; the elevation term should be invisible; the kinetic term noticeable, because 360 m/s is fast.", "@solve:E3", "# Bottom line", "Compute all three fluid terms once; learn which ones [[matter]], then you may drop the rest for life."], "ask": [{"q": "Why does Δh come out negative?", "a": "The steam gives up energy as shaft work and heat; its enthalpy must fall."}, {"q": "Which term was negligible and which was not?", "a": "gΔz ≈ 0.05 kJ/kg negligible; ΔKE = 63 kJ/kg not, because 360 m/s is fast."}, {"q": "Why convert 500 kg/h to kg/s?", "a": "The powers are in kW = kJ/s; time units must match."}], "teach": "Before solving, ask: which of the three fluid terms do you expect to be invisible? Vote, then verify.", "book": "Çengel 9e §5-3, turbine style [10e §5-4]"}, {"n": 10, "title": "The official solution", "img": "img/p-10.jpg", "lines": ["This is the AU solution of the turbine example we worked on slide 9: same ṁ = 0.139 kg/s, same Δh ≈ −650 kJ/kg. Press Next."], "ask": [{"q": "Point at the −650: which three ingredients built it?", "a": "−587 from work and heat per kg, −63 from kinetic energy, +0.05 from elevation."}], "teach": "One line: our numbers, their layout. Move on.", "book": "Çengel 9e §5-3 [10e §5-4]"}, {"n": 11, "title": "Efficiency: define the output and the input first", "img": "img/p-11.jpg", "lines": ["# What the word means (Çengel §2-7, Eq. 2-41)", "Efficiency tells us how well an energy [[conversion]] or [[transfer]] process is accomplished:", "= η = [[desired output]] ÷ [[required input]]", "# Why the book calls it 'one of the most misused terms'", "The number is meaningless until both words are [[defined]]. Same device, different definition of 'desired output' ⇒ different efficiency.", "Every efficiency of a real device lies between [[0]] and [[100 %]]. 0 % means the device only produced [[waste heat]] (it behaves like a resistance heater).", "# Define them for devices you know", "Water heater:  output = [[heat delivered to the water]],  input = [[energy in the fuel or electricity]].  Book values: gas ≈ 55 %, electric ≈ 90 %.", "Electric motor:  output = [[mechanical (shaft) power]],  input = [[electric power]].      Generator: the reverse.", "Power plant:  output = [[net electric work]],  input = [[heating value of the fuel burned]].", "# Ask", "The electric heater is 90 % efficient and the gas heater 55 %, yet the gas heater costs less to run per year. How can both be true? Efficiency is a ratio of energies; it says nothing about the [[price per kJ of the input]]."], "ask": [{"q": "Efficiency in five words?", "a": "Useful output over required input."}, {"q": "Why is efficiency 'the most misused term'?", "a": "Because 'useful' depends on the purpose: the same device scores differently for different jobs."}, {"q": "Can the first law alone give an efficiency?", "a": "No: it says energy survived, not whether it came out in the wanted form."}], "teach": "Hook: a 1000 W heater converts all 1000 W to heat. Is it 100 % efficient? For heating, yes.", "book": "Çengel 9e §2-7 [10e §2-7]"}, {"n": 12, "title": "Energy converter: what the two laws say", "img": "img/p-12.jpg", "lines": ["# The generic converter (box with one arrow in, one arrow out)", "First law: energy output = [[energy input]], always. Nothing is lost in total.", "Second law: the [[useful]] energy output is always less than the input. Part of the input always leaves as [[waste heat]] (rejected heat).", "# Heat engine (the bottom picture)", "Fuel burns ⇒ heat in Q_in. The engine gives [[mechanical work]] W_out and must reject heat Q_rej to a cooler body.", "= First law on the engine:  Q_in = [[W_out]] + [[Q_rej]]", "= Thermal efficiency:  η_th = [[W_out ÷ Q_in]] = 1 − Q_rej/Q_in"], "ask": [{"q": "An energy conversion device, in one sentence?", "a": "Takes energy in one form, hands most of it on in another."}, {"q": "First law vs second law for these devices?", "a": "Output energy = input energy (first law); useful output < input (second law)."}, {"q": "Name a device where the 'loss' is the product.", "a": "A heater: the heat is the point."}], "teach": "Collect device examples from the class and sort them into input → output boxes live.", "book": "Çengel 9e §2-7 [10e §2-7]"}, {"n": 13, "title": "Four converters: what goes in, what comes out", "img": "img/p-13.jpg", "lines": ["# One idea for all four", "An energy conversion device takes one form of energy in and gives another form out. Its efficiency is always  [[what comes out]] ÷ [[what goes in]], in the same units (power ÷ power, or energy ÷ energy).", "# Read each row of the slide: in → device → out", "(a) Gearbox: [[mechanical power]] in → mechanical power out.   η_mech = P_out ÷ P_in.  (The difference is lost as [[friction]] heat.)", "(b) Turbine: [[fluid]] power in (hot steam or gas) → mechanical (shaft) power out.   η_tur = P_actual ÷ P_isentropic, i.e. what the real turbine gives ÷ what a [[perfect]] turbine would give."], "ask": [{"q": "Gearbox: what in, what out?", "a": "Mechanical in, mechanical out: η = P_out/P_in."}, {"q": "Which converter uses COP instead of η, and why?", "a": "Refrigerator/heat pump: useful output can exceed paid input, so 'efficiency' would exceed 1."}, {"q": "A heat engine's unwanted output?", "a": "Heat rejected to the surroundings."}], "teach": "Walk the four boxes left to right, asking in/out for each before revealing.", "book": "Çengel 9e §2-7 [10e §2-7]"}, {"n": 14, "title": "Example: the electric motor", "img": "img/p-14.jpg", "lines": ["# Read it like an engineer", "A motor consumes [[100]] W of electricity and delivers [[90]] W of mechanical power. One number missing: the efficiency.", "# Strategy", "Useful out over paid in. Powers work exactly like energies here, because the time units cancel.", "@solve:E4", "# Bottom line", "Efficiency = what you [[wanted]] ÷ what you [[paid]]; the missing 10 W left as heat."], "ask": [{"q": "η of a pump that takes 2 kW and delivers 1.5 kW of flow power?", "a": "75 %."}, {"q": "Does η = 90 % break the first law?", "a": "No: all 100 W are accounted for, 90 W shaft + 10 W heat."}, {"q": "Why can we use watts instead of joules in the ratio?", "a": "Both powers are per second; the seconds cancel."}], "teach": "Give the class 30 seconds to answer before you reveal: this one they can all get.", "book": "Çengel 9e §2-7 [10e §2-7]"}, {"n": 15, "title": "A chain of devices: efficiencies multiply", "img": "img/p-15.jpg", "lines": ["# Why", "The output of device 1 is the [[input]] of device 2. Losses stack: each stage keeps only a fraction of what it receives.", "= η_system = η₁ × η₂ × η₃        (book Eq. 2-43 for a plant: η_overall = η_combustion × η_thermal × η_generator)", "Walk 100 units through: 100 → η₁ = 0.88 → [[88]] → η₂ = 0.40 → [[35.2]] → η₃ = 0.98 → [[34.5]] units out.", "# The two things to remember", "The system is always worse than its [[worst]] link. One weak device sets the ceiling.", "Wrong way: averaging (0.88 + 0.40 + 0.98)/3 = 0.75. Cross it out: losses [[compound]], they do not average.", "# Ask", "Two devices at 50 % each in series: overall? [[25 %]]. Where did the missing 65 % of the plant's fuel energy go? [[rejected heat: cooling tower, sea, flue gas]]"], "ask": [{"q": "Two devices in series, 80 % each: system η?", "a": "64 %: fractions multiply."}, {"q": "Why is a chain always worse than its weakest member?", "a": "Every stage passes on only a fraction of what it receives."}, {"q": "Where to spend upgrade money in a chain?", "a": "On the weakest device: it dominates the product."}], "teach": "Guess first: is a chain of 88, 40, 98 % better or worse than plain 40 %?", "book": "Çengel 9e §2-7 [10e §2-7]"}, {"n": 16, "title": "Example: the power plant chain", "img": "img/p-16.jpg", "lines": ["# Read it like an engineer", "Three devices in a row: boiler [[88]] %, turbine [[40]] %, generator [[98]] %. Missing: the plant's overall efficiency.", "# Strategy", "Series devices: each hands a fraction to the next, so the fractions [[multiply]]. Predict first: the answer must land below the worst member, 40 %.", "@solve:E5", "# Bottom line", "A chain of devices is always [[worse]] than its weakest link; fix the weakest first."], "ask": [{"q": "Multiply 0.88 × 0.40 × 0.98 to two digits in your head.", "a": "≈ 0.35, i.e. 35 %."}, {"q": "Only 35 % of the fuel becomes electricity: where is the rest?", "a": "Heat: mostly the turbine's rejected heat, plus boiler and generator losses."}, {"q": "Boiler 88→93 % or turbine 40→45 %: which upgrade wins?", "a": "Turbine: 0.88·0.45·0.98 = 38.8 % beats 0.93·0.40·0.98 = 36.5 %."}], "teach": "Have three students be boiler, turbine, generator and pass a '100 kJ' ball, each keeping their share.", "book": "Çengel 9e §2-7, in the style of Ex. 2-16 [10e §2-7]"}, {"n": 17, "title": "Pure substance: same chemistry everywhere", "img": "img/p-17.jpg", "lines": ["# Definition (Çengel §3-1)", "A pure substance has a fixed [[chemical composition]] throughout. Water, nitrogen, helium, CO₂.", "It does not have to be a single element or compound: a [[homogeneous]] mixture such as air counts, as long as it stays one phase.", "A mixture of two or more [[phases]] of a pure substance is still pure if every phase has the same composition: ice + liquid water is pure.", "Not pure: oil + water (two chemically different regions). Also not pure: liquid air + gaseous air, because the components [[condense at different temperatures]].", "# Why we care", "For a pure substance the state is fixed by [[two]] independent properties, so one table with two entries describes it. That is the whole of Chapter 3."], "ask": [{"q": "Is air a pure substance? Is an oil-water mix?", "a": "Air yes (uniform composition); oil-water no (composition differs by location)."}, {"q": "Is ice plus liquid water pure?", "a": "Yes: two phases, one chemical composition, H₂O."}, {"q": "Why do we care whether a substance is pure?", "a": "Only pure substances have the simple two-property state rule and one set of tables."}], "teach": "Quick-fire: shout substances, class answers pure or not.", "book": "Çengel 9e §3-1 [10e §3-1]"}, {"n": 18, "title": "Three phases: how tightly the molecules hold", "img": "img/p-18.jpg", "lines": ["# What a phase is (Çengel §3-2)", "A phase has a distinct [[molecular arrangement]], homogeneous throughout, separated from other phases by identifiable boundary surfaces.", "Three principal phases: [[solid]], [[liquid]], [[gas]]. (A substance can have several phases inside one principal phase: carbon as graphite or diamond; ice has seven phases at high pressure.)", "# The pictures", "(a) Solid: molecules in a 3-D lattice, held by large spring-like forces; they only [[oscillate]] about fixed positions. Melting begins when groups of molecules break away.", "(b) Liquid: spacing similar to the solid, but molecules [[rotate and translate]] past each other.", "(c) Gas: molecules far apart, [[random]] motion, weak forces, much higher energy level. A gas must release a large amount of energy before it can condense or freeze.", "Intermolecular bonds: strongest in [[solids]], weakest in [[gases]]."], "ask": [{"q": "What holds a solid together that a liquid lacks?", "a": "Molecules locked in a lattice; liquids keep distance but lose the fixed positions."}, {"q": "Which phase has molecules that barely interact?", "a": "Gas: far apart, high speed, collisions only."}, {"q": "Why does phase matter for energy?", "a": "Each phase stores different amounts; changing phase costs or releases large energy."}], "teach": "Three students: statue (solid), crowd shuffling (liquid), sprinters (gas).", "book": "Çengel 9e §3-2 [10e §3-2]"}, {"n": 19, "title": "States 1 and 2: compressed liquid, saturated liquid", "img": "img/p-19.jpg", "lines": ["# The set-up (Çengel §3-3, Fig. 3-5 to 3-6)", "Water in a piston-cylinder. The weight on the piston keeps the pressure at [[1 atm]] for the whole experiment. We add heat and watch T and v.", "# State 1, 20 °C", "All liquid and [[not about to vaporize]]: a [[compressed liquid]] (also called subcooled liquid). Heating it to 40 °C expands it only slightly; the pressure stays constant.", "# State 2, 100 °C", "Still all liquid, but one more joule and vapour appears: a liquid that is [[about to vaporize]] is a [[saturated liquid]].", "# Start the T-v sketch on the board now", "Axes: T up, v across, label the line P = 1 atm. Plot 1 at (small v, 20 °C) and 2 at (slightly larger v, 100 °C). Between them T [[rises]] and v grows only [[a little]] (liquids barely expand).", "# Ask", "Why does the piston hardly move between state 1 and state 2? [[liquid water expands very little with temperature]]"], "ask": [{"q": "At 1 atm and 20 °C, which state is water in?", "a": "Compressed (subcooled) liquid: far from boiling."}, {"q": "What makes a liquid 'saturated'?", "a": "It sits exactly at the boiling point for its pressure: any heat added starts making vapour."}, {"q": "During boiling at fixed pressure, what does T do?", "a": "Stays constant until the last drop vaporizes."}], "teach": "Heat an imaginary pot on the board, marking states 1 and 2 as the temperature climbs.", "book": "Çengel 9e §3-3, Fig. 3-6 to 3-8 [10e §3-3]"}, {"n": 20, "title": "States 3, 4, 5: mixture, sat. vapour, superheated", "img": "img/p-20.jpg", "lines": ["# Keep heating from state 2 (Çengel §3-3, Fig. 3-7 to 3-9)", "The temperature stays at [[100 °C]] until the last drop of liquid is gone. The energy goes into [[breaking molecular bonds]], not into raising T.", "State 3: part liquid, part vapour at 100 °C: a [[saturated liquid-vapour mixture]]. Mid-way, equal amounts of each.", "State 4: all vapour, still 100 °C, [[about to condense]]: a [[saturated vapour]].", "State 5: more heat ⇒ T rises again, 300 °C: a vapour [[not about to condense]] is a [[superheated vapour]].", "# What the piston does", "Between 2 and 4 the volume grows enormously (about [[1600 times]] for water at 1 atm); the piston shoots up while T is constant.", "Continue the T-v sketch: long horizontal line 2 → 4 at 100 °C, point 3 in the middle, rising curve to 5 at 300 °C. Label the three regions along the path: compressed liquid | saturated mixture | superheated vapour.", "# Ask", "A pot boils vigorously on a high flame: which state is the water in, and what is its temperature? [[state 3, a mixture, 100 °C no matter how high the flame]]"], "ask": [{"q": "What is a saturated mixture?", "a": "Liquid and vapour together at the boiling state: states 2 to 4 of the heating story."}, {"q": "When does water become superheated?", "a": "After the last drop vaporizes, any further heat raises T above T_sat."}, {"q": "In which of states 1-5 are T and P independent?", "a": "1 (compressed liquid) and 5 (superheated): off the boiling line."}], "teach": "Continue the pot story to state 5; ask the class to name each stop.", "book": "Çengel 9e §3-3, Fig. 3-9 to 3-11 [10e §3-3]"}, {"n": 21, "title": "The T-v diagram at 1 atm: the picture you just drew", "img": "img/p-21.jpg", "lines": ["# Reading the official figure (Çengel Fig. 3-10)", "The flat segment 2 → 4 is the [[phase change]]; its length on the v axis is the volume jump, and the heat it costs is the latent heat (slide 23).", "Cooling retraces the path 5 → 1 and releases exactly the heat that was [[added]]. The diagram is a road, not a one-way street.", "The axes use v (per kg), not V: the diagram belongs to the [[substance]], not to the amount of it.", "In thermodynamics 'water' and 'steam' both mean [[H₂O]]; the word says which phase.", "@fig:domeTv|One pot at 1 atm: the heating line, drawn live", "# Ask", "Repeat the experiment at 2 atm: is the flat line higher or lower? [[higher: water boils above 100 °C at higher pressure]]  (that is slide 22)"], "ask": [{"q": "Why is the boiling segment horizontal on a T-v diagram?", "a": "At fixed P, boiling happens at one temperature while v grows: T flat, v stretching."}, {"q": "What are the two ends of the flat segment?", "a": "Saturated liquid (left), saturated vapour (right)."}, {"q": "What does the steep left branch say about liquids?", "a": "Huge T change, tiny v change: liquids barely expand."}], "teach": "Draw the 1 atm heating line live as the class dictates what happens at each stage.", "book": "Çengel 9e §3-3, Fig. 3-12 [10e §3-3]"}, {"n": 22, "title": "T_sat and P_sat are tied together", "img": "img/p-22.jpg", "lines": ["# Definitions (Çengel §3-3)", "At a given pressure, the temperature at which a pure substance changes phase is the [[saturation temperature]] T_sat.", "At a given temperature, the pressure at which it changes phase is the [[saturation pressure]] P_sat.", "'Water boils at 100 °C' is incomplete: it boils at 100 °C [[at 1 atm]]. At 500 kPa it boils at [[151.8 °C]]; at 2.34 kPa it boils at 20 °C (Table 3-1).", "# The curve (liquid-vapour saturation curve, Fig. 3-11)", "P_sat = f(T_sat): one curve for each pure substance, rising steeply. T_sat [[increases]] with P_sat.", "Consequence: during a phase change, P and T are [[dependent]] properties. Give me one, I know the other. Outside the dome they are independent.", "Everyday proof: a pressure cooker at about 3 atm boils at [[134 °C]], so food cooks in 20 min instead of 1 to 2 hours.", "# Ask", "You open a can of R-134a at 25 °C. The pressure drops to 1 atm. What happens? [[it boils and cools to −26 °C, its T_sat at 1 atm]]"], "ask": [{"q": "T_sat at 101.325 kPa for water?", "a": "99.97 ≈ 100 °C: the definition of normal boiling."}, {"q": "If P_sat(60 °C) ≈ 20 kPa, what happens to 60 °C water in a 15 kPa chamber?", "a": "It boils: ambient pressure below its saturation pressure."}, {"q": "State the T_sat-P_sat rule in one line.", "a": "Boiling temperature and pressure come in fixed pairs: give one, the other is set."}], "teach": "Ask why astronauts' blood would boil: the P_sat pairing answers it.", "book": "Çengel 9e §3-3, Table 3-1 region [10e §3-3]"}, {"n": 23, "title": "Latent heat, and boiling on a mountain", "img": "img/p-23.jpg", "lines": ["# Latent heat (Çengel §3-3)", "Latent heat: the energy [[absorbed or released]] during a phase change. Latent means hidden: it goes in and the thermometer does not see it.", "Latent heat of fusion (melting = freezing): [[333.7 kJ/kg]] for water at 1 atm.   Latent heat of vaporization (boiling = condensing): [[2256.5 kJ/kg]].", "Compare: heating liquid water from 0 to 100 °C costs about 420 kJ/kg. Boiling it costs more than [[five]] times that. This is why the flat line on the T-v diagram is so long.", "The magnitudes depend on the [[temperature or pressure]] at which the phase change happens (they shrink toward the critical point).", "# Altitude (Table 3-2)", "Atmospheric pressure falls with elevation, so T_sat falls: about [[3 °C per 1000 m]]. At 2000 m water boils at 93.3 °C; at 5000 m at 83.3 °C; at 20 000 m at 34.7 °C.", "# Ask", "Why does sweating cool you? [[evaporating water takes its latent heat, about 2400 kJ/kg, from the skin]]"], "ask": [{"q": "What is latent heat of vaporization?", "a": "Energy to turn 1 kg of saturated liquid into vapour at constant T and P: h_fg."}, {"q": "Why does food cook slower in the mountains?", "a": "Lower pressure, lower T_sat: the water boils cooler, about 90 °C at 2000 m."}, {"q": "What does a pressure cooker change?", "a": "Raises P, so T_sat rises to about 120 °C: hotter water, faster cooking."}], "teach": "Menti-style vote: boiling on Everest is hotter/cooler/same, then explain.", "book": "Çengel 9e §3-3 [10e §3-3]"}, {"n": 24, "title": "The dome and the critical point", "img": "img/p-24.jpg", "lines": ["# The story", "Boil water at 1 atm, then at 1 MPa, then at 10 MPa. Each time it boils at a [[higher]] temperature and the flat boiling line gets [[shorter]].", "At 22.06 MPa the line shrinks to a single point: the [[critical point]]. There, liquid and vapour become the same thing. Water: T_cr = 373.95 °C.", "# Build the picture", "Join all the left ends: the [[saturated liquid]] line. Join all the right ends: the [[saturated vapour]] line. Together they make the dome.", "Right figure: the [[triple point]], the one P and T where ice, water and steam live together (0.01 °C, 0.61 kPa).", "@fig:domeTv|Raise the pressure and watch the flat line shrink into the dome", "# Bottom line", "The dome is the boiling zone. Above the critical point there is [[no boiling]] at all, the liquid just slides into vapour."], "ask": [{"q": "What happens to the flat boiling segment as P rises?", "a": "It shortens: v_f and v_g close in on each other."}, {"q": "Define the critical point in one sentence.", "a": "The state where saturated liquid and saturated vapour become identical (22.06 MPa, 373.95 °C for water)."}, {"q": "Does water boil at 30 MPa?", "a": "No distinct boiling above P_cr: the liquid slides smoothly into vapour."}], "teach": "Stack the boiling experiments pressure by pressure on the board, then join the ends into the dome.", "book": "Çengel 9e §3-4, Fig. 3-15, 3-20 [10e §3-4]"}, {"n": 25, "title": "The map: T-v and P-v", "img": "img/p-25.jpg", "lines": ["# The story", "This is the map we will use for the rest of the course. Three regions, two lines, one point.", "Left of the dome: [[compressed liquid]].  Inside: [[saturated mixture]] (wet steam).  Right: [[superheated vapour]].", "# Reading the two maps", "T-v map: the dashed lines are constant [[pressure]].  P-v map: the dashed lines are constant [[temperature]].", "Fig. 3-18: take weights off the piston slowly at 150 °C. The water boils the moment P drops to P_sat = [[476 kPa]].", "# Bottom line", "Before any table or equation, ask one question: [[where on the map am I?]]"], "ask": [{"q": "Name the three regions of the T-v map.", "a": "Compressed liquid (left), saturated mixture (inside), superheated vapour (right)."}, {"q": "On the T-v diagram the dashed curves are lines of constant what?", "a": "Pressure; on P-v they are constant temperature."}, {"q": "What is the first question before any table?", "a": "Where on the map am I?"}], "teach": "This is the slide to tattoo: cover the regions and have the class name them blind.", "book": "Çengel 9e §3-4, Fig. 3-17, 3-18 [10e §3-4]"}, {"n": 26, "title": "Adding ice to the map", "img": "img/p-26.jpg", "lines": ["# The story", "Most substances [[shrink]] when they freeze. Water is the odd one: it [[expands]], so ice is lighter and floats.", "That is why lakes freeze from the top and fish survive the winter underneat
