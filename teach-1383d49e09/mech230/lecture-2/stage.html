h.", "# On the diagram", "The solid region joins on the left. The triple line is where solid, liquid and vapour all exist at the same [[P and T]].", "# Bottom line", "Diagram (b) is water: the solid-liquid line leans [[left]] because ice takes more room than water."], "ask": [{"q": "Water vs most substances on freezing?", "a": "Water expands (ice floats); most substances contract."}, {"q": "What is the triple line?", "a": "The states where solid, liquid and vapour coexist at one P and T."}, {"q": "Why does ice floating matter for life?", "a": "Lakes freeze from the top; water below stays liquid for fish."}], "teach": "One question first: why do lakes not freeze solid from the bottom?", "book": "Çengel 9e §3-4, Fig. 3-19, 3-21 [10e §3-4]"}, {"n": 27, "title": "The whole map in one picture", "img": "img/p-27.jpg", "lines": ["# The story", "Five names to remember: saturated liquid line, saturated vapour line, compressed liquid, superheated vapour, and the [[wet]] region inside.", "Below P_cr a heating line crosses the dome: you see [[boiling]]. Above P_cr it passes over the top: no boiling, a smooth change.", "# Why this matters next week", "Inside the dome, T and P are tied together ([[dependent]]): knowing one gives the other. Outside, they are [[independent]]: you need both.", "# Bottom line", "Inside the dome one number plus quality fixes the state; outside the dome you need [[two]] numbers."], "ask": [{"q": "The five names of the map?", "a": "Saturated liquid line, saturated vapour line; compressed liquid, saturated mixture (wet), superheated vapour regions."}, {"q": "Inside the dome, how many independent properties fix the state?", "a": "One of T or P plus the quality x: T and P are tied."}, {"q": "Above the critical pressure, what do we call the substance?", "a": "Superheated vapour above T_cr, compressed liquid below: no boiling between them."}], "teach": "Blank-map quiz: point at each region and line, the class names them.", "book": "Çengel 9e §3-4 summary [10e §3-4]"}, {"n": 28, "title": "Tables, and a new friend: enthalpy", "img": "img/p-28.jpg", "lines": ["# The story", "Real substances are too complicated for one neat formula, so engineers measured everything and wrote it in [[tables]]. Your job is to read them well.", "# Enthalpy", "= h = u + [[P v]]   (kJ/kg)", "Why invent it? Flowing fluid always carries u plus the push work Pv (slide 5). Adding them once saves writing them twice, so the tables list [[h]] directly.", "Units check: kPa × m³/kg = [[kJ/kg]]. Pressure times volume is energy.", "# Bottom line", "When fluid flows, use [[h]]. When it sits in a tank, use [[u]]."], "ask": [{"q": "Why tables instead of one formula?", "a": "Property relations for real substances are too complex; measurements are tabulated instead."}, {"q": "Define enthalpy and say why it exists.", "a": "h = u + Pv: flowing fluid always carries u plus flow work Pv, so the sum gets its own column."}, {"q": "Units check: kPa times m³ gives what?", "a": "kJ: pressure × volume is energy."}], "teach": "Show u + Pv appearing twice in the slide-5 balance, then name it once: h.", "book": "Çengel 9e §3-5, Eq. 3-1, 3-2 [10e §3-5]"}, {"n": 29, "title": "Tables A-4 and A-5: f, g, fg", "img": "img/p-29.jpg", "lines": ["# The story", "Same data, two doorways. A-4 is sorted by [[temperature]], A-5 by [[pressure]]. Enter through whichever you were given.", "# Three subscripts", "f = saturated [[liquid]] (the left edge), g = saturated [[vapour]] (the right edge), fg = the [[jump]] between them.", "At 90 °C: v_f = 0.001036, v_g = [[2.3593]] m³/kg. Steam takes about 2300 times the room of the water it came from.", "h_fg is the latent heat from slide 23: the energy to boil 1 kg. It shrinks as P rises and reaches [[zero]] at the critical point.", "# Bottom line", "f is liquid, g is gas, fg is the [[difference]]: v_fg = v_g − v_f."], "ask": [{"q": "A-4 vs A-5: what is the difference?", "a": "Same saturation data; A-4 is sorted by temperature, A-5 by pressure."}, {"q": "Decode v_f, v_g, v_fg.", "a": "Saturated liquid v, saturated vapour v, and their difference v_g − v_f."}, {"q": "What happens to h_fg as P rises to the critical point?", "a": "Shrinks to zero: liquid and vapour merge."}], "teach": "Project the 90 °C row and have students read each column aloud.", "book": "Çengel 9e §3-5, Tables A-4, A-5 [10e §3-5]"}, {"n": 30, "title": "Saturated states live on the edges", "img": "img/p-30.jpg", "lines": ["# The story", "A saturated state is never inside the dome, it sits on an [[edge]]. Left edge: read the f column. Right edge: read the g column.", "Left picture: saturated liquid at 90 °C. Its pressure is not a free choice, it must be P_sat = [[70.18 kPa]].", "Right picture: at 100 kPa the whole boiling line sits at T_sat = [[99.6 °C]], from v_f to v_g.", "# Bottom line", "'Saturated' means one number is enough: give me P or T and the table gives me [[everything else]]."], "ask": [{"q": "'Saturated liquid at 90 °C': how many more numbers fix the state?", "a": "None: one number plus the word saturated pins it; the table gives the rest."}, {"q": "Where do saturated states live on the diagram?", "a": "On the dome's edges: left edge f, right edge g."}, {"q": "Saturated vapour at 100 kPa: its temperature?", "a": "T_sat at 100 kPa = 99.6 °C; no choice in the matter."}], "teach": "Point at each sketch and ask: which edge, which column?", "book": "Çengel 9e §3-5, Fig. 3-28 to 3-30 [10e §3-5]"}, {"n": 31, "title": "Quality x: how much is steam", "img": "img/p-31.jpg", "lines": ["# The story", "Inside the dome we have a mixture of liquid and vapour. Quality tells us how much of the [[mass]] is vapour.", "= x = m_vapour ÷ m_total", "x = [[0]] means all liquid, x = [[1]] means all vapour, 0.3 means 30 % of the kilograms are steam.", "Quality only exists [[inside the dome]]. For compressed liquid or superheated vapour, x has no meaning.", "# Bottom line", "Inside the dome the state is fixed by T (or P) plus [[x]]. Quick check: 10 kg, 8 kg liquid, x = [[0.2]]."], "ask": [{"q": "Quality x in one line?", "a": "Mass of vapour over total mass, 0 to 1, defined only inside the dome."}, {"q": "10 kg of mixture, 8 kg liquid: x?", "a": "x = 2/10 = 0.2."}, {"q": "Why is x meaningless for superheated steam?", "a": "No liquid present: there is no mixture to describe."}], "teach": "Three quick oral x calculations before the formula goes on the board.", "book": "Çengel 9e §3-5, Eq. 3-3 [10e §3-5]"}, {"n": 32, "title": "The lever rule: y = y_f + x y_fg", "img": "img/p-32.jpg", "lines": ["# The story", "A mixture's property is just a weighted average of liquid and vapour, weighted by quality.", "= v = v_f + x [[v_fg]]        u = u_f + x u_fg        h = h_f + x h_fg", "Turn it around to find quality from a measured property:  x = [[(v − v_f) ÷ v_fg]].", "# Picture", "On the diagram x is the fraction of the way across the dome: halfway means x = [[0.5]].", "# Bottom line", "Any mixture value must sit between f and g. If your v is bigger than v_g, you are [[not in the dome]]."], "ask": [{"q": "Write the lever rule for v.", "a": "v = v_f + x·v_fg."}, {"q": "Measured v = 1.0 m³/kg at 100 °C (v_f ≈ 0.001, v_g = 1.672): x?", "a": "x = (1.0 − 0.001)/1.671 ≈ 0.60."}, {"q": "Your computed v beats v_g: meaning?", "a": "You are outside the dome: superheated, x undefined."}], "teach": "Draw the dome's width as a metre stick: x is just how far across you stand.", "book": "Çengel 9e §3-5, Eq. 3-4 to 3-7, Fig. 3-33 [10e §3-5]"}, {"n": 33, "title": "Superheated vapour: Table A-6", "img": "img/p-33.jpg", "lines": ["# The story", "Right of the dome the steam is dry and hot. T and P are now [[independent]], so the table needs both: pick the [[pressure]] block, then the [[temperature]] row.", "First row of each block is 'Sat.', the g values. Between rows, use linear [[interpolation]].", "# How to recognise it", "T > T_sat at the given P,   or   v > [[v_g]],   or   h > h_g. Any one of these is enough.", "# Bottom line", "Hotter than boiling at that pressure means superheated: open [[A-6]]."], "ask": [{"q": "Three ways to recognise superheated vapour?", "a": "T > T_sat at P; v > v_g; h > h_g (any one suffices)."}, {"q": "Why does A-6 need two inputs?", "a": "Off the dome, T and P are independent: both are needed."}, {"q": "Steam at 0.5 MPa, 100 °C: superheated?", "a": "No: 100 < T_sat = 151.83 °C, it is compressed liquid."}], "teach": "Open A-6 live: find the pressure block, then the temperature row, read h.", "book": "Çengel 9e §3-5, Table A-6 [10e §3-5]"}, {"n": 34, "title": "Compressed liquid: the shortcut", "img": "img/p-34.jpg", "lines": ["# The story", "Liquids barely care about pressure. Squeeze water 100 times harder and its properties move by less than [[1 %]].", "= y ≈ y_f @ T     (v, u or h: take the f value at the given [[temperature]])", "Table A-7 exists but starts at [[5 MPa]]. Below that the shortcut is all we have.", "# How to recognise it", "T < T_sat at the given P,   or   v < v_f. The figure: 75 °C at 500 kPa, T_sat is 151.8 °C, so it is [[compressed liquid]], u ≈ u_f at 75 °C.", "# Bottom line (the decision tree)", "Given T and P: compare T with T_sat@P.  Below ⇒ [[liquid]], A-4 at T.  Equal ⇒ [[mixture]], need x.  Above ⇒ [[superheated]], A-6."], "ask": [{"q": "The compressed-liquid shortcut?", "a": "y ≈ y_f at the given temperature (not pressure), for v, u, h."}, {"q": "Why temperature and not pressure?", "a": "Liquid properties barely feel pressure; they follow T."}, {"q": "Recite the T vs T_sat decision tree.", "a": "T < T_sat: compressed liquid; T = T_sat: saturated; T > T_sat: superheated."}], "teach": "Finish by drawing the decision tree next to the dome and having the class recite it twice.", "book": "Çengel 9e §3-5, Eq. 3-8, Table A-7 [10e §3-5]"}, {"n": 35, "title": "Problem 1: saturated liquid in a rigid tank", "img": "img/p-35.jpg", "lines": ["# Read it like an engineer", "A rigid tank holds [[50]] kg of saturated liquid water at [[90]] °C. Find the pressure and the volume.", "# Strategy", "'Saturated liquid' pins the state to the [[left edge]] of the dome: one number (T) fixes everything, so Table [[A-4]] at the 90 °C row answers both questions. Sanity check: 50 kg of liquid water is about 50 L, a big bucket, so V should land near [[0.05]] m³.", "@solve:P1", "# Bottom line", "On the saturation line the pressure is not a choice: T picks [[P]], and the f columns do the rest."], "ask": [{"q": "Why is P not free to choose here?", "a": "On the saturation line T and P are paired: 90 °C water boils only at 70.183 kPa."}, {"q": "What volume would the v_g column have given, and why is it absurd?", "a": "50 × 2.3593 = 118 m³: a room full of steam, not 50 kg of liquid."}, {"q": "Same tank but saturated vapour at 90 °C: new V?", "a": "V = 50 × 2.3593 = 118 m³; same T, other edge of the dome."}], "teach": "Before solving, ask the class which table and which row; only then compute.", "book": "Çengel 9e §3-5, Ex. 3-1 [10e Ex. 3-1]"}, {"n": 36, "title": "Table A-4, the row we just used", "img": "img/p-36.jpg", "lines": ["This is the A-4 extract: temperature rows, f and g columns. We read the 90 °C row on the last slide. Press Next."], "ask": [{"q": "Which column gives the volume of boiling liquid water?", "a": "v_f: saturated liquid specific volume."}], "teach": "One line and move on.", "book": "Çengel 9e Table A-4"}, {"n": 37, "title": "Problem 2: saturated mixture, P and V", "img": "img/p-37.jpg", "lines": ["# Read it like an engineer", "The same 90 °C tank, but now [[10]] kg of water of which [[8]] kg is liquid and 2 kg vapour. Find P and V.", "# Strategy", "Liquid and vapour together: [[inside]] the dome. The pressure question is unchanged (T fixes it); the volume needs the mix. Two routes: quality + lever rule, or add the two phase volumes; we do both as a built-in [[check]].", "@solve:P2", "# Bottom line", "Two kg of vapour fill [[99.8]] % of the tank: quality is a mass fraction, never a volume fraction."], "ask": [{"q": "x = 8/10 = 0.8: what went wrong?", "a": "Quality is the vapour fraction: x = m_g/m_t = 2/10 = 0.2."}, {"q": "Why is P the same as in Problem 1?", "a": "Still saturated at 90 °C: the mixture does not change the T-P pairing."}, {"q": "Without the lever rule, how else do you get V?", "a": "V = m_f·v_f + m_g·v_g: add the two phase volumes."}], "teach": "Trap first: ask for x and let someone say 0.8; correct it publicly and kindly.", "book": "Çengel 9e §3-5, Ex. 3-4 [10e Ex. 3-4]"}, {"n": 38, "title": "Problem 3: R-134a, 80 litres, 4 kg", "img": "img/p-38.jpg", "lines": ["# Read it like an engineer", "A vessel of [[80]] L holds [[4]] kg of refrigerant-134a at [[160]] kPa. Find T, x, h, and the volume taken by the vapour.", "# Strategy", "Nobody says the region this time: that is the lesson. Compute v = V/m, then run the [[region test]] against v_f and v_g from Table [[A-12]]. Only after the test may we say T = T_sat and use the lever rule. Order: v, region, T, x, h, V_g.", "@solve:P3", "# Bottom line", "When the region is not announced, the region test is [[step one]], always."], "ask": [{"q": "Why can't we look up T directly from 160 kPa?", "a": "Only if saturated; the region test must confirm v_f < v < v_g first."}, {"q": "15.7 % of the mass fills 97 % of the volume: why?", "a": "Vapour is light but bulky: v_g is 166 times v_f here."}, {"q": "Which table serves R-134a by pressure?", "a": "A-12 (A-11 is by temperature)."}], "teach": "Hide the word 'mixture' and ask the class what region we are in; make them prove it.", "book": "Çengel 9e §3-5, Ex. 3-5 [10e Ex. 3-5]"}, {"n": 39, "title": "The official solution", "img": "img/p-39.jpg", "lines": ["This is the AU solution of the R-134a problem from slide 38; same numbers: −15.6 °C, x = 0.157, h = 64.1 kJ/kg, V_g = 77.6 L. Press Next."], "ask": [{"q": "Which number proves we were inside the dome?", "a": "v = 0.02 sits between v_f = 0.0007 and v_g = 0.1236 m³/kg."}], "teach": "One line and move on.", "book": "Çengel 9e Ex. 3-5"}, {"n": 40, "title": "Table A-12, the row we just used", "img": "img/p-40.jpg", "lines": ["The A-12 extract: 160 kPa row, f and g columns for R-134a. Press Next."], "ask": [{"q": "T_sat of R-134a at 160 kPa?", "a": "−15.6 °C: refrigerants boil cold at low pressure; that is their job."}], "teach": "One line and move on.", "book": "Çengel 9e Table A-12"}, {"n": 41, "title": "Problem 4: compressed liquid, exact vs shortcut", "img": "img/p-41.jpg", "lines": ["# Read it like an engineer", "Water at [[80]] °C under [[5]] MPa. Find u from the compressed-liquid table, then from the shortcut, then the error between them.", "# Strategy", "First the region test: 5 MPa against P_sat(80 °C) = [[47.4]] kPa; far above, so compressed liquid. Route 1: Table [[A-7]] directly. Route 2: u ≈ u_f at the same [[temperature]]. Then compare.", "@solve:P4", "# Bottom line", "Squeezing water 100 times harder moved u by [[0.34]] %: liquids follow temperature, not pressure."], "ask": [{"q": "Why does the shortcut use T and not P?", "a": "Liquid properties barely respond to pressure; temperature sets them."}, {"q": "When is the shortcut your only option?", "a": "Below 5 MPa, where Table A-7 has no rows."}, {"q": "Is 0.34 % acceptable for engineering work?", "a": "Almost always: well under the 1 % we tolerate for liquid approximations."}], "teach": "Ask for a bet: how wrong will the shortcut be? Collect guesses, then show 0.34 %.", "book": "Çengel 9e §3-5, Ex. 3-8 [10e Ex. 3-8]"}, {"n": 42, "title": "Problem 5: superheated, find the temperature", "img": "img/p-42.jpg", "lines": ["# Read it like an engineer", "Water at [[0.5]] MPa with h = [[2890]] kJ/kg. Find T. No region given: test first.", "# Strategy", "Compare h with h_g at 0.5 MPa ([[2748.1]]): above it, so superheated, Table [[A-6]]. The block has no 2890 row, so we [[interpolate]] between 200 and 250 °C.", "@solve:P5", "# Bottom line", "Interpolation is just 'how far along the gap am I': here 32.5 % of the way, so T = [[216.3]] °C."], "ask": [{"q": "Why A-6 and not A-4 or A-5?", "a": "h > h_g says superheated; the saturation tables stop at the dome's edge."}, {"q": "The sanity check on the answer?", "a": "T must beat T_sat(0.5 MPa) = 151.83 °C; 216.3 does."}, {"q": "h = 2748.1 exactly: what state?", "a": "Saturated vapour, x = 1, T = 151.83 °C: the right edge itself."}], "teach": "Do the interpolation on the board slowly once; it returns in every exam.", "book": "Çengel 9e §3-5, Ex. 3-7 [10e Ex. 3-7]"}, {"n": 43, "title": "Problem 6: fill the table (a) to (e)", "img": "img/p-43.jpg", "lines": ["# Read it like an engineer", "Five rows of water, each missing pieces: (a) P = 200 kPa, x = 0.6. (b) T = 125 °C, u = 1600. (c) P = 1 MPa, u = 2950. (d) T = 75 °C, P = 500 kPa. (e) P = 850 kPa, x = [[0]]. Fill T, P, u, x and the phase of each.", "# Strategy", "One question for every row: [[where on the map am I?]] If x is given, the region is announced. If not, compare the given u (or T) against the f and g values at the given T (or P): below f is [[liquid]], between is mixture, above g is [[superheated]]. Then the right table answers in one line.", "@solve:P6", "# Bottom line", "Five rows, one rule: region [[first]], table second."], "ask": [{"q": "Row (d) hands you P = 500 kPa. What do you do with it?", "a": "Use it only for T_sat in the region test; the u value then follows the temperature: u ≈ u_f(75 °C)."}, {"q": "In row (c), why is x blank in the answer?", "a": "Superheated: no liquid, no quality."}, {"q": "Which rows needed no region test at all?", "a": "(a) and (e): a given x announces the region."}], "teach": "Run it as a game: one row per pair of students, five minutes, then compare with the solve.", "book": "Çengel 9e §3-5, Ex. 3-9 [10e Ex. 3-9]", "map": {"title": "Problem 6 · the map we will place every row on", "cap": "T-v map", "pts": []}}, {"n": 44, "title": "Official solution, rows (a) and (b)", "img": "img/p-44.jpg", "lines": ["AU's worked rows (a) and (b): same 120.21 °C, 1719.3 kJ/kg; 232.23 kPa, x = 0.535. We built them on slide 43. Press Next."], "ask": [{"q": "Row (b): why did we compare u with u_f and u_g?", "a": "No x given: the comparison is the region test that picks the table."}], "teach": "One line and move on.", "book": "Çengel 9e Ex. 3-9"}, {"n": 45, "title": "Official solution, rows (c) and (d)", "img": "img/p-45.jpg", "lines": ["AU's rows (c) and (d): superheated 395.2 °C by interpolation; compressed liquid u ≈ 313.99 kJ/kg at 75 °C. Press Next."], "ask": [{"q": "Row (d) in one sentence?", "a": "75 °C is far below T_sat(500 kPa) = 151.8 °C: compressed liquid, read u_f at 75 °C."}], "teach": "One line and move on.", "book": "Çengel 9e Ex. 3-9"}, {"n": 46, "title": "Official solution, row (e)", "img": "img/p-46.jpg", "lines": ["AU's row (e): x = 0 means saturated liquid: 172.94 °C, u = 731.00 kJ/kg from the f columns at 850 kPa. Press Next."], "ask": [{"q": "What did x = 0 buy us?", "a": "The region for free: left edge of the dome, f columns, no test needed."}], "teach": "One line and move on.", "book": "Çengel 9e Ex. 3-9"}, {"n": 47, "title": "Problem 7: the adiabatic steam turbine", "img": "img/p-47.jpg", "lines": ["# Read it like an engineer", "Tables meet the first law. Steam enters a turbine at [[2]] MPa and 400 °C at 50 m/s, 10 m up; it leaves at [[15]] kPa with quality [[0.9]], at 180 m/s, 6 m up. The turbine is adiabatic and delivers [[5]] MW. Find the work per kg and the mass flow.", "# Strategy", "Two states to pin, then one balance. State 1: region test (400 °C vs T_sat at 2 MPa), then A-6. State 2: quality given, so the [[lever rule]] at 15 kPa. Keep all three fluid terms once more, to see their sizes. Sanity: w should land near the enthalpy drop, around [[900]] kJ/kg.", "@solve:P7", "# Bottom line", "In a turbine the [[enthalpy drop]] is the whole story: KE cost us 15 kJ/kg, elevation 0.04."], "ask": [{"q": "Why is state 2 pinned without a temperature?", "a": "P and x inside the dome fix everything: h₂ = h_f + x·h_fg at 15 kPa."}, {"q": "Which term would you keep if forced to drop two?", "a": "h₁ − h₂ = 887 kJ/kg; the others are 2 % and 0.005 % of it."}, {"q": "ṁ came out 5.73 kg/s. What if the turbine were only 80 % efficient?", "a": "For the same 5 MW output you need more steam: ṁ = 5000/(0.8·872.5) = 7.2 kg/s."}], "teach": "Ask which table serves each state before touching the balance.", "book": "Çengel 9e §5-4, turbine example family [10e §5-4]"}, {"n": 48, "title": "The official solution", "img": "img/p-48.jpg", "lines": ["AU's solution of the turbine: same h₁ = 3248.4, h₂ = 2361.0, w = 872.5 kJ/kg, ṁ = 5.73 kg/s. Press Next."], "ask": [{"q": "Which line of this slide is the region test?", "a": "T₁ = 400 °C > T_sat(2 MPa) = 212.4 °C: superheated, hence A-6."}], "teach": "One line and move on.", "book": "Çengel 9e §5-4"}, {"n": 49, "title": "Problem 8: throttling R-134a", "img": "img/p-49.jpg", "lines": ["# Read it like an engineer", "A capillary tube drops refrigerant from [[0.8]] MPa, saturated liquid, to [[0.12]] MPa. Find the exit quality and the temperature drop.", "# Strategy", "The throttle rule does the heavy lifting: h₂ = [[h₁]]. Pin state 1 from the f columns, carry h across, region-test it at 0.12 MPa, then the lever rule gives x₂ and T_sat gives T₂. Sanity: throttling a liquid into low pressure must [[cool]] it; expect tens of degrees.", "@solve:P8", "# Bottom line", "No cold source anywhere: [[flashing]] liquid into vapour eats its own latent heat, and the stream chills by 54 °C. That is your refrigerator."], "ask": [{"q": "Why is h constant across a throttle?", "a": "No work, no heat, negligible KE/PE change in a tiny device: the balance leaves h₂ = h₁."}, {"q": "Where did the cooling energy come from?", "a": "From the liquid itself: 34 % of it evaporated, absorbing latent heat from the rest."}, {"q": "What does this device do in your kitchen fridge?", "a": "It is the capillary tube between condenser and evaporator: makes the cold, low-P mixture."}], "teach": "Start with the mystery: we cool 54 degrees with no cold source. Who pays?", "book": "Çengel 9e §5-4, throttling valves [10e §5-4]"}, {"n": 50, "title": "Problem 9: turbine with efficiency", "img": "img/p-50.jpg", "lines": ["# Read it like an engineer", "Steam from [[2]] MPa, 250 °C to 0.1 MPa with x₂ = [[0.85]]; no heat loss, no KE/PE. Find the ideal work per kg; then with efficiency [[80]] % and flow [[600]] kg/min, the actual power.", "# Strategy", "The balance collapses to w = h₁ − h₂: all the effort is pinning the two states (A-6 for the superheated inlet, lever rule at 0.1 MPa for the exit). Then two conversions: kg/min to kg/s, and η applied to the [[power]], not to the enthalpies.", "@solve:P9", "# Bottom line", "Ideal first, reality second: compute the perfect [[w]], then let η shave it."], "ask": [{"q": "Why divide 600 by 60?", "a": "kg/min to kg/s, so kg/s × kJ/kg = kW comes out directly."}, {"q": "Where does the 20 % lost work go?", "a": "Friction and turbulence inside the turbine: it reappears as slightly hotter, wetter exhaust."}, {"q": "Ideal power before the η?", "a": "10 × 566.9 = 5669 kW ≈ 5.7 MW."}], "teach": "Let the class spot both unit conversions before solving; they are the whole difficulty.", "book": "Çengel 9e §5-4 with isentropic efficiency idea [10e §5-4]"}, {"n": 51, "title": "The official solution", "img": "img/p-51.jpg", "lines": ["AU's solution: h₁ = 2903.3, h₂ = 2336.4, w = 566.9 kJ/kg, Ẇ ≈ 4.5 MW. Press Next."], "ask": [{"q": "One sentence: why 4535 kW and not 5669 kW?", "a": "Only 80 % of the ideal work reaches the shaft."}], "teach": "One line and move on.", "book": "Çengel 9e §5-4"}, {"n": 52, "title": "Problem 10: steam nozzle with heat loss", "img": "img/p-52.jpg", "lines": ["# Read it like an engineer", "Steam at [[800]] kPa, 400 °C enters a nozzle at 10 m/s through [[800]] cm²; it leaves at 200 kPa, 300 °C. The nozzle loses [[25]] kW of heat. Find the exit velocity and exit volume flow.", "# Strategy", "A nozzle makes [[speed]], not work: the balance trades enthalpy for V²/2. Both states are superheated (A-6 twice). ṁ comes from the inlet area: ṁ = A₁V₁/[[v₁]]. Watch the two unit moves: cm² to m², and kJ/kg × 1000 to m²/s².", "@solve:P10", "# Bottom line", "A 196 kJ/kg enthalpy drop became [[606]] m/s: that is all a nozzle is."], "ask": [{"q": "Why does v appear in ṁ = AV/v?", "a": "AV is volume per second; divide by volume per kg to get kg per second."}, {"q": "Why could we ignore the inlet KE?", "a": "10²/2 = 50 m²/s² against 183 600: a 0.03 % correction."}, {"q": "Exit area if we wanted it?", "a": "A₂ = ṁv₂/V₂ = 2.082·1.316/606 ≈ 45 cm²: the nozzle narrows."}], "teach": "Ask what a nozzle is for before the math: speed, and only speed.", "book": "Çengel 9e §5-4, nozzle family [10e §5-4]"}, {"n": 53, "title": "The official solution", "img": "img/p-53.jpg", "lines": ["AU's nozzle solution: same ṁ = 2.082 kg/s, V₂ = 606 m/s, 2.74 m³/s. Press Next."], "ask": [{"q": "Which single number in this solution is the nozzle's purpose?", "a": "V₂ = 606 m/s."}], "teach": "One line and move on.", "book": "Çengel 9e §5-4"}, {"n": 54, "title": "Problem 11: the mixing chamber", "img": "img/p-54.jpg", "lines": ["# Read it like an engineer", "Cold water, [[2.5]] kg/s at 200 kPa and 20 °C, is heated by mixing with steam at 200 kPa and [[150]] °C. The chamber loses [[1200]] kJ/min; the mix leaves at 60 °C. Find the steam flow ṁ₂.", "# Strategy", "Two inlets, one exit: a [[mass]] balance and an energy balance, two equations for two unknowns (ṁ₂, ṁ₃). Region-test each stream against T_sat(200 kPa) = [[120.2]] °C: 20 and 60 °C are compressed liquid (h ≈ h_f at T), 150 °C is superheated (A-6). Then substitute and solve.", "@solve:P11", "# Bottom line", "Three streams, three regions, one T_sat line to sort them: the region test is a [[sorting]] machine."], "ask": [{"q": "Why h_f at 20 °C and not at 200 kPa?", "a": "Compressed liquid follows temperature: h ≈ h_f(T), the pressure is nearly irrelevant."}, {"q": "What would ṁ₂ be without the heat loss?", "a": "0.166 kg/s, the number printed on the AU slide; with the 20 kW loss, 0.174."}, {"q": "Why does a mixing chamber need no work term?", "a": "No shaft, no moving boundary: it is just a tee where streams meet."}], "teach": "Draw the tee, write T_sat = 120.2 °C across it, and let the class sort the three streams.", "book": "Çengel 9e §5-4, mixing chambers [10e §5-4]"}, {"n": 55, "title": "The official solution", "img": "img/p-55.jpg", "lines": ["AU's mixing solution (without the heat loss): ṁ₂ = 0.166 kg/s. Our slide-54 version kept the 20 kW loss: 0.174 kg/s. Decide which you quote and say why. Press Next."], "ask": [{"q": "Why do the two answers differ?", "a": "The slide drops the 1200 kJ/min loss; keeping it demands slightly more steam."}], "teach": "One line and move on.", "book": "Çengel 9e §5-4"}, {"n": 56, "title": "Test yourself: two parting puzzles", "img": "img/p-56.jpg", "lines": ["# Read it like an engineer", "Two take-home checks of everything today. One: wet steam at [[1.0]] MPa, x = 0.95, throttled to 10 kPa; find the exit quality. Two: a rigid 0.5 m³ container of mixture at 101.3 kPa, x = [[0.5]], heated until P = 151.95 kPa; find both temperatures, both vapour masses, and the pressure when the last drop vanishes.", "# Strategy", "Puzzle 1 is the throttle rule plus a region test with a [[trap]] inside. Puzzle 2 hangs on one sentence: rigid and closed means [[v]] never changes; everything else is table rows and the lever rule run forwards and backwards.", "@solve:P12", "@solve:P13", "# Bottom line", "If your quality comes out above [[1]], you are not wrong by a little: you have left the dome, and the state is superheated."], "ask": [{"q": "Puzzle 1: what is the alarm bell in x₂ = 1.04?", "a": "Quality cannot exceed 1: h₂ > h_g, the steam is superheated and x is undefined."}, {"q": "Puzzle 2: which quantity is frozen and why?", "a": "v: rigid fixes V, closed fixes m, so v = V/m is locked."}, {"q": "What instrument uses puzzle 1 in reverse?", "a": "The throttling calorimeter: throttle wet steam, measure the superheated exit, back out the quality."}], "teach": "Assign both as the exit ticket; next lecture opens with their solutions.", "book": "Çengel 9e §5-4 and §3-5 combined [10e §5-4, §3-5]"}];
let cur=0, built=0, askI=0, tHandle=null;
try{ const c=parseInt(localStorage.getItem('stage_cur')); if(!isNaN(c)&&c>=0&&c<DATA.length) cur=c; }catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function mth(t){ if(!t)return''; t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); if(t.length>60&&(t.includes(',\\qquad ')||t.includes(';\\qquad ')||t.includes(';\\quad '))){ const parts=t.split(/[,;]\\q?quad /); return '\\[\\begin{gathered}'+parts.join(' \\\\[3pt] ')+'\\end{gathered}\\]'; } return '\\['+t+'\\]'; }
function parseLine(l){
  if(l.startsWith('@solve:')) return {kind:'solve',key:l.slice(7).trim()};
  if(l.startsWith('@fig:')){ const [m,cap]=l.slice(5).split('|'); return {kind:'fig',mode:m.trim(),cap:(cap||'').trim()}; }
  let kind='p', t=l;
  if(l.startsWith('# ')){kind='h';t=l.slice(2);} else if(l.startsWith('= ')){kind='eq';t=l.slice(2);} else if(l.startsWith('  ')){t=l.trim();}
  t=t.replace(/ {3,}/g,m=>' '.repeat(m.length));
  const html=esc(t).replace(/\[\[(.+?)\]\]/g,(m,a)=>`<span class="gap" data-a="${a}">${a}</span>`);
  return {kind,html};
}
// build steps: each content line = a step; each gap inside = a step. Headings ride along with the next line.
let steps=[]; // {type:'line',el} or {type:'gap',el}
function render(){
  const d=DATA[cur];
  $('eyebrow').textContent='AU slide '+d.n+' of '+DATA.length;
  $('title').textContent=d.title;
  $('slide').src=d.img;
  $('ctr').textContent=(cur+1)+' / '+DATA.length;
  $('prog').style.width=((cur+1)/DATA.length*100)+'%';
  const box=$('lines'); box.innerHTML=''; steps=[];
  let pendingHeads=[];
  d.lines.forEach(l=>{
    const pl=parseLine(l); const {kind,html}=pl;
    if(kind==='solve'){ const sv=SOLVES[pl.key]; const box2=document.createElement('div'); box2.className='solve'; box2.innerHTML='<div class="st">'+esc(sv.title)+'</div>'; box.appendChild(box2); pendingHeads.forEach(h=>{}); const heads=pendingHeads; pendingHeads=[];
      sv.steps.forEach((s,i)=>{ const d=document.createElement('div'); d.className='step'; d.innerHTML='<div class="sh"><span class="tag">Step '+(i+1)+'</span><span>'+esc(s.t)+'</span></div>'+(s.note?'<div class="note">'+esc(s.note)+'</div>':'')+'<div class="eq">'+mth(s.eq)+'</div>'+(s.tbl?'<div class="tbl"><b>&#128214; Using the table</b> '+esc(s.tbl)+'</div>':'')+'<div class="num">'+mth(s.num)+'</div>'+(s.res?'<div class="res">'+mth(s.res)+'</div>':''); box2.appendChild(d);
        if(s.sys){ const sk=makeSysSketch(s.sys); const eqEl=d.querySelector('.eq'); d.insertBefore(sk,eqEl); }
        steps.push({type:'line',el:d,heads:i===0?heads:[],map:s.map||null}); steps.push({type:'show',el:d.querySelector('.num')}); if(s.res) steps.push({type:'show',el:d.querySelector('.res')}); });
      return; }
    if(kind==='fig'){ const f=makeTs(pl.mode); f.classList.add('line','infig'); const c=document.createElement('div'); c.className='cap'; c.textContent=pl.cap||''; const en=document.createElement('button'); en.className='enl'; en.textContent='Enlarge ⤢'; en.onclick=()=>openTs(pl.mode); c.appendChild(en); f.insertBefore(c,f.firstChild); box.appendChild(f); steps.push({type:'line',el:f,heads:pendingHeads}); pendingHeads=[]; return; }
    const el=document.createElement('div'); el.className='line '+(kind==='h'?'h':kind==='eq'?'eq':''); el.innerHTML=html; box.appendChild(el);
    if(kind==='h'){ pendingHeads.push(el); return; }
    steps.push({type:'line',el,heads:pendingHeads}); pendingHeads=[];
    el.querySelectorAll('.gap').forEach(g=>steps.push({type:'gap',el:g}));
  });
  pendingHeads.forEach(h=>steps.push({type:'line',el:h,heads:[]}));
  curMap=undefined; built=0; apply();
  $('dTeach').textContent=d.teach||'—'; $('dBook').textContent=d.book||'—';
  $('jump').innerHTML=DATA.map((s,i)=>`<button data-j="${i}" class="${i===cur?'cur':''}">${s.n}</button>`).join('');
  try{localStorage.setItem('stage_cur',cur);}catch(e){}
  if(window.MathJax&&MathJax.typesetPromise) MathJax.typesetPromise([$('lines')]).catch(()=>{});
  askI=0; $('bPrev').disabled=cur===0; $('bNext').disabled=cur===DATA.length-1;
}
function apply(){
  steps.forEach((s,i)=>{
    const on=i<built;
    if(s.type==='line'){ s.el.classList.toggle('show',on); s.heads.forEach(h=>h.classList.toggle('show',on)); }
    else if(s.type==='show') s.el.classList.toggle('show',on);
    else s.el.classList.toggle('open',on);
  });
  let mmap=(DATA[cur]&&DATA[cur].map)||null; for(let i=0;i<built;i++){ if(steps[i].map) mmap=steps[i].map; } setMinimap(mmap);
  const nxt=steps[built];
  $('dNext').textContent=nxt?(nxt.type==='gap'?'reveal: '+nxt.el.dataset.a:nxt.type==='show'?(nxt.el.classList.contains('res')?'show the result':'show the numbers'):'show: '+nxt.el.textContent.slice(0,90)):'(slide complete → next slide)';
  $('bBuild').textContent=built>=steps.length?(cur<DATA.length-1?'Next slide ▸':'End'):'Next ▸';

function makeDomeMap(md,mini){
  // md = {title, pts:[{v,T,k,lab,col,dx,dy}]}  col: 'or' mixture · 'nv' liquid edge · 'gr' superheated

  el('line',{x1:ml,y1:Y(0),x2:W-mr,y2:Y(0),stroke:C.mu,'stroke-width':1.2}); el('line',{x1:ml,y1:Y(0),x2:ml,y2:mt,stroke:C.mu,'stroke-width':1.2});

    [0.001,0.01,0.1,1,10,100].forEach(v=>{ el('line',{x1:X(v),y1:Y(0),x2:X(v),y2:Y(0)+4,stroke:C.mu}); el('text',{x:X(v),y:Y(0)+16,'text-anchor':'middle','font-size':11,fill:C.mu},v<1?v:v.toFixed(0)); });
    el('text',{x:(ml+W-mr)/2,y:Y(0)+32,'text-anchor':'middle','font-size':12,fill:C.mu},'v, m³/kg  (log scale)'); el('text',{x:ml-8,y:mt+4,'font-size':12,fill:C.mu,'text-anchor':'end'},'T, °C'); }
  el('path',{d:'M'+SATV.map(r=>X(r[1])+','+Y(r[0])).join(' L'),fill:'none',stroke:C.nv,'stroke-width':mini?5:3});
  el('path',{d:'M'+SATV.map(r=>X(r[2])+','+Y(r[0])).join(' L'),fill:'none',stroke:C.or,'stroke-width':mini?5:3});
  el('circle',{cx:X(0.003106),cy:Y(373.95),r:mini?8:6,fill:C.gr,stroke:'#fff','stroke-width':1.5});

    const f=(T-a[0])/((b[0]-a[0])||1); return X(a[wi])+f*(X(b[wi])-X(a[wi])); }
  (md.pts||[]).forEach(p=>{ const x=(p.x!=null)?(edgeX(p.T,1)+p.x*(edgeX(p.T,2)-edgeX(p.T,1))):(X(p.v)+(p.off||0)),y=Y(p.T),c=COL[p.col]||C.or;

  return wrap;

  const rP=el('rect',{x:x0,y:160,height:34,width:0,fill:C.or,rx:4}); const tP=el('text',{x:0,y:183,'font-size':13,fill:'#fff','font-weight':700});

let tsFig=null;

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT') return;
  const askOn=$('ask').classList.contains('on');
  if(e.key==='Escape'){ $('ask').classList.remove('on'); $('black').classList.remove('on'); $('zoom').classList.remove('on'); $('tslab').classList.remove('on'); if(tsFig&&tsFig.stop) tsFig.stop(); stopTimer(); return; }
  if($('tslab').classList.contains('on')){ if((e.key===' '||e.key==='ArrowRight'||e.key==='Enter')&&tsFig&&tsFig.stepNext){ e.preventDefault(); tsFig.stepNext(); } return; }
  if($('zoom').classList.contains('on')){ if(e.key.toLowerCase()==='z'||e.key===' '||e.key==='Enter'){ e.preventDefault(); $('zoom').classList.remove('on'); } return; }
  if($('black').classList.contains('on')){ if(e.key.toLowerCase()==='b') $('black').classList.remove('on'); return; }
  if(askOn){ if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){ e.preventDefault(); if($('askA').classList.contains('on')&&tsFig&&tsFig.stepNext&&tsFig.stepNext()) return; $('askReveal').click(); } if(e.key.toLowerCase()==='a'){ askI++; showAsk(); } return; }
  switch(e.key){
    case ' ': case 'ArrowRight': case 'Enter': case 'PageDown': e.preventDefault(); build(); break;
    case 'ArrowLeft': case 'Backspace': e.preventDefault(); unbuild(); break;
    case 'n': case 'N': case 'ArrowDown': go(cur+1); break;
    case 'p': case 'P': case 'ArrowUp': case 'PageUp': go(cur-1); break;
    case 'a': case 'A': showAsk(); break;
    case 'r': case 'R': revealAll(); break;
    case 't': case 'T': $('bPres').click(); break;
    case 'f': case 'F': $('bFull').click(); break;
    case 'b': case 'B': $('bBlack').click(); break;
    case 's': case 'S': $('bSplit').click(); break;
    case 'z': case 'Z': toggleZoom(); break;
    case 'd': case 'D': openTs('boilerP'); break;
    case 'Home': go(0); break; case 'End': go(DATA.length-1); break;
  }
});
